<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SnapEat</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0b0f0e;--card:#141a18;--c2:#1b2421;--c3:#222e2a;--line:#273430;
  --tx:#eef5f2;--hint:#879992;--ac:#3ddc97;--ac2:#2bc482;--bad:#ff6b6b;
  --cp:#6aa8ff;--cf:#ffc15e;--cc:#c58bff;--cw:#4cc3ff;--gold:#ffb84d
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--tx);
  font:15px/1.42 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:12px 14px calc(92px + env(safe-area-inset-bottom,0px));
}
button,input,select,textarea{font:inherit;color:inherit}
.row{display:flex;align-items:center;gap:8px}.sp{justify-content:space-between}.f1{flex:1;min-width:0}
.card{background:var(--card);border:1px solid rgba(255,255,255,.04);border-radius:22px;padding:15px;margin-top:12px;box-shadow:0 6px 24px rgba(0,0,0,.22)}
h2{font-size:17px;margin:0 0 8px;letter-spacing:-.2px}.hint{color:var(--hint);font-size:13px}
.logo{font-weight:900;font-size:20px;letter-spacing:-.6px;display:flex;align-items:center;gap:6px}.logo i{color:var(--ac);font-style:normal}
.chip{border:1px solid rgba(255,255,255,.06);background:var(--c2);border-radius:20px;padding:6px 11px;font-size:13px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;transition:transform .1s;text-decoration:none}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--ac);color:#042416;font-weight:700;border-color:transparent}
.chip.pro{background:linear-gradient(135deg,#ffc15e,#ff7a45);color:#261000;font-weight:800;border:0}
.x{border:0;background:none;color:var(--hint);font-size:20px;padding:4px 8px;cursor:pointer}

.qbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.qtile{
  border:1px solid rgba(255,255,255,.05);background:linear-gradient(180deg,var(--c2),var(--card));
  border-radius:18px;padding:11px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;
  cursor:pointer;transition:transform .12s,border-color .15s;text-align:center
}
.qtile:active{transform:scale(.95);border-color:var(--ac)}
.qtile .ico{font-size:21px;line-height:1}
.qtile span{font-size:12px;font-weight:600;color:var(--tx)}

.ring{position:relative;width:206px;height:206px;margin:0 auto}.ring svg{transform:rotate(-90deg)}
.ring circle.v{transition:stroke-dashoffset .85s cubic-bezier(.2,.8,.2,1)}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{font-size:44px;font-weight:800;letter-spacing:-2px;line-height:1}
.mac{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin:6px 0 5px}.bar i{display:block;height:100%;border-radius:4px;transition:width .75s}
.ent{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}.ent:first-of-type{border-top:0}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.add{border:0;background:var(--ac);color:#042416;width:34px;height:34px;border-radius:50%;font-size:21px;line-height:1;cursor:pointer;flex:none;font-weight:800;display:flex;align-items:center;justify-content:center}
.add:active{transform:scale(.92)}
.btn{width:100%;border:0;border-radius:15px;background:var(--ac);color:#042416;padding:13px;font-weight:700;cursor:pointer;margin-top:12px;transition:opacity .15s,transform .1s;text-decoration:none;display:inline-block;text-align:center}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.5}
.btn.alt{background:var(--c2);color:var(--tx);font-weight:600;border:1px solid rgba(255,255,255,.05)}.btn.dn{color:var(--bad)}
.btn.gold{background:linear-gradient(135deg,#ffc15e,#ff8547);color:#240e00;font-weight:800}
.btn.sbp{background:linear-gradient(135deg,#3ddc97,#25b5d8);color:#042022;font-weight:800}
.wb{border:0;background:var(--c2);border-radius:13px;padding:10px 14px;cursor:pointer;color:var(--cw);font-weight:700}
.wb:active{transform:scale(.96)}

nav{
  position:fixed;left:0;right:0;bottom:0;display:flex;gap:4px;
  background:rgba(20,26,24,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:7px 10px calc(7px + env(safe-area-inset-bottom,0px));z-index:4
}
nav button{
  flex:1;border:0;background:none;padding:7px 2px;border-radius:14px;color:var(--hint);
  cursor:pointer;font-weight:600;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px
}
nav button .ni{font-size:18px;line-height:1.1}
nav button.on{color:var(--ac);background:var(--c2)}

#M{position:fixed;inset:0;background:rgba(0,0,0,.68);backdrop-filter:blur(4px);display:none;align-items:flex-end;z-index:6}#M.on{display:flex}
.sheet{background:var(--bg);border-top:1px solid var(--line);width:100%;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.seg{display:flex;background:var(--card);border-radius:13px;padding:3px;gap:3px;margin-bottom:6px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px 6px;cursor:pointer;font-size:13px;color:var(--hint);white-space:nowrap}
.seg button.on{background:var(--c3);color:var(--tx);font-weight:700}
label{display:block;font-size:13px;color:var(--hint);margin:12px 0 4px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:13px;padding:11px 12px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}input[type=checkbox]{width:20px;height:20px;accent-color:var(--ac)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.step{border:0;background:var(--c2);border-radius:12px;width:46px;height:44px;font-size:20px;cursor:pointer;flex:none}
.gi{width:76px;padding:8px;text-align:center}
.plan{border:1px solid var(--line);background:var(--c2);border-radius:18px;padding:13px;margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.plan.feat{border:1.5px solid var(--gold);background:linear-gradient(135deg,rgba(255,193,94,.08),var(--c2))}
.sk{border-radius:14px;background:linear-gradient(90deg,var(--card) 25%,var(--c2) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
.wk{display:flex;gap:6px;align-items:flex-end;height:140px;position:relative;margin-top:8px}.wk div.d{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}.wk i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--ac);min-height:2px}
.gl{position:absolute;left:0;right:0;border-top:1px dashed var(--hint);pointer-events:none}
.badge{background:var(--cf);color:#261000;font-size:11px;font-weight:800;border-radius:8px;padding:2px 7px;vertical-align:middle}
#T{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#eef5f2;color:#0b0f0e;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;z-index:9;display:none;max-width:90%;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.gcard{border:1px solid var(--line);background:var(--c2);border-radius:18px;padding:13px;margin-top:12px}
.gbtn{border:1px dashed var(--ac);background:rgba(61,220,151,.09);border-radius:12px;padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--ac)}
.pct-big{font-size:24px;font-weight:800;color:var(--ac)}
.refbox{background:linear-gradient(135deg,rgba(61,220,151,.12),rgba(76,195,255,.08));border:1px solid rgba(61,220,151,.25);border-radius:18px;padding:14px;margin-top:12px}
.supbox{background:var(--c2);border:1px solid var(--line);border-radius:18px;padding:13px;margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.wsvg{width:100%;height:110px;display:block;margin-top:8px}
.step-pill{font-size:12px;font-weight:700;color:var(--ac);background:rgba(61,220,151,.12);border:1px solid rgba(61,220,151,.25);padding:4px 10px;border-radius:12px}
.gear-btn{border:1px solid var(--line);background:var(--c2);border-radius:13px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;flex:none;transition:transform .12s,border-color .15s}
.gear-btn:active{transform:scale(.94);border-color:var(--ac)}
.chnbox{background:linear-gradient(135deg,rgba(76,195,255,.11),rgba(61,220,151,.08));border:1px solid rgba(76,195,255,.26);border-radius:18px;padding:13px;margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.welcome-chn{background:linear-gradient(135deg,rgba(61,220,151,.14),rgba(76,195,255,.10));border:1px solid rgba(61,220,151,.32);border-radius:20px;padding:14px;margin-top:12px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div><nav id="nav"></nav><div id="M"></div><div id="T"></div>
<script>
const tg=window.Telegram?.WebApp||{ready(){},expand(){},initData:'',initDataUnsafe:{},openInvoice(){},openTelegramLink(){},openLink(){}};
tg.ready();tg.expand();try{tg.setHeaderColor('#0b0f0e');tg.setBackgroundColor('#0b0f0e')}catch{}

const $=s=>document.querySelector(s),r0=v=>Math.round(Number(v)||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localIso=(d=new Date())=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${dd}`};
const parseIso=s=>{const [y,m,d]=String(s||'').split('-').map(Number);return new Date(y||2026,(m||1)-1,d||1,12,0,0)};
const MEALS=[['breakfast','Завтрак'],['lunch','Обед'],['dinner','Ужин'],['snack','Перекус']];
const dm=()=>{const h=new Date().getHours();return h<11?'breakfast':h<16?'lunch':h<21?'dinner':'snack'};
const SUPPORT_HANDLE='@snapeat_manager';
const SUPPORT_URL='https://t.me/snapeat_manager';
const CHANNEL_HANDLE='@snapeat_app';
const CHANNEL_URL='https://t.me/snapeat_app';

let day=localIso(),S=null,W=null,PF=null,regStep=1,tab='diary',mode='',seed=0,pending=null,atab='text',am='snack',busy=false,pc0=0,mealPlan=null,lastAiInput={text:'',image:'',label_mode:false},trialModalShownThisSession=false,channelBannerDismissed=false;

function cleanNum(v){
  if(v===null||v===undefined)return NaN;
  const n=parseFloat(String(v).replace(',','.').trim());
  return Number.isFinite(n)?n:NaN;
}

async function api(p,m='GET',b){
  const ctrl=typeof AbortController!=='undefined'?new AbortController():null;const tid=ctrl?setTimeout(()=>ctrl.abort(),48000):null;
  let r;try{r=await fetch(p,{method:m,headers:{'Content-Type':'application/json','X-Init-Data':tg.initData||''},body:b?JSON.stringify(b):undefined,signal:ctrl?.signal});}catch(err){if(tid)clearTimeout(tid);throw{status:0,detail:err?.name==='AbortError'?'Превышено время ожидания ответа сервера':'Ошибка сети. Проверьте соединение'}}finally{if(tid)clearTimeout(tid);}
  if(!r.ok){let d='';try{d=(await r.json()).detail}catch{}throw{status:r.status,detail:typeof d==='string'?d:'Проверьте введённые данные'}}
  return r.json();
}
function toast(t){const e=$('#T');if(!e)return;e.textContent=String(t||'');e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3200)}
function modal(h){const m=$('#M');if(!m)return;m.innerHTML='<div class="sheet"><div class="grab"></div>'+h+'</div>';m.classList.add('on')}
function closeM(){const m=$('#M');if(m)m.classList.remove('on');pending=null}
$('#M').onclick=e=>{if(e.target.id==='M')closeM()};
const mac=o=>`${r0(o?.kcal)} ккал · Б ${r0(o?.p)} Ж ${r0(o?.f)} У ${r0(o?.c)}`;
const sk=(h,m='12px 0 0')=>`<div class="sk" style="height:${h}px;margin:${m}"></div>`;

function openSupport(){
  const url=(S?.support?.url)||SUPPORT_URL;
  try{tg.openTelegramLink(url)}catch{window.open(url,'_blank','noopener,noreferrer')}
}
function openChannel(){
  const url=(S?.channel?.url)||CHANNEL_URL;
  try{tg.openTelegramLink(url)}catch{window.open(url,'_blank','noopener,noreferrer')}
}
function dismissChannelBanner(){
  channelBannerDismissed=true;
  render();
}

function openRequestForm(){
  modal(`<h2>📩 Оставить запрос администратору</h2>
  <div class="hint">Опишите вопрос по подписке, оплате или работе приложения — ответ придёт прямо в чат с ботом.</div>
  <label>Тема</label>
  <select id="reqCat">
    <option value="general">Общий вопрос</option>
    <option value="payment">Вопрос по оплате</option>
    <option value="subscription">Подписка / тариф</option>
    <option value="bug">Ошибка в приложении</option>
  </select>
  <label>Сообщение</label>
  <textarea id="reqMsg" rows="3" maxlength="800" placeholder="Опишите ваш запрос..."></textarea>
  <button class="btn" onclick="sendSupportReq()">Отправить запрос</button>
  <button class="btn alt" onclick="openSupport()">Написать в Telegram (${esc((S?.support?.handle)||SUPPORT_HANDLE)})</button>
  <button class="btn alt" onclick="closeM()">Отмена</button>`);
}

async function sendSupportReq(){
  const category=$('#reqCat')?.value||'general';
  const message=($('#reqMsg')?.value||'').trim();
  if(message.length<3)return toast('Опишите ваш вопрос чуть подробнее');
  try{
    await api('/api/support/request','POST',{category,message});
    closeM();toast('Запрос отправлен! Ответ придёт в чат с ботом.');
  }catch(e){toast(e.detail||'Не удалось отправить запрос')}
}

function openTrialExhaustedModal(customMsg=''){
  const a=S?.ai||{};
  const cap=a.trial_monthly_limit||5;
  modal(`<h2>⏳ Пробные запросы закончились</h2>
  <div style="color:var(--cf);margin-bottom:10px;font-weight:600">${esc(customMsg||`Вы использовали все ${cap} бесплатных пробных запросов на этот месяц.`)}</div>
  <div class="hint">Выберите пакет запросов или подписку SnapEat Pro (299 ₽ / 150 ⭐) — оплата доступна через СБП/карту (ЮKassa) и Telegram Stars.</div>
  <button class="btn gold" onclick="openPro('Выбор тарифа после окончания пробных запросов')">Открыть тарифы и оплату</button>
  <button class="btn alt" onclick="openSupport()">💬 Написать в поддержку (${esc((S?.support?.handle)||SUPPORT_HANDLE)})</button>
  <button class="btn alt" onclick="closeM()">Закрыть</button>`);
}

function defaultProfile(){
  const tgFirst = tg.initDataUnsafe?.user?.first_name || '';
  return {
    name: S?.user_name || tgFirst || '',
    sex:'m',age:28,height:175,weight:75,target_weight:null,
    act:1.375,goal:'keep',pace:.5,workouts_per_week:2,
    workout_type:'mixed',food_pref:'balanced',use_ai_tuning:true,
    manual:false,remind_on:1,remind_hour:20
  };
}

async function load(){
  if(!S)$('#app').innerHTML=sk(32,'0')+sk(74)+sk(240)+sk(90);
  const tz=-new Date().getTimezoneOffset();
  try{S=await api(`/api/state?day=${day}&today=${localIso()}&tz=${tz}`)}
  catch(e){$('#app').innerHTML=`<p class="hint" style="padding:30px;text-align:center">${esc(e.detail||'Не удалось загрузить данные')}</p>`;return}
  if(!PF)PF=S.profile?{...defaultProfile(),...S.profile}:defaultProfile();
  if(!S.norm){tab='profile';regStep=1}
  render();
  if(S.ai?.trial_exhausted && !trialModalShownThisSession && S.norm){
    trialModalShownThisSession=true;
    openTrialExhaustedModal();
  }
}
function go(k){tab=k;if(k==='week')W=null;PF=S?.profile?{...defaultProfile(),...S.profile}:PF;render()}
function render(){
  if(!S||!S.ai)return;
  const a=S.ai;
  $('#nav').style.display=S.norm?'flex':'none';
  $('#nav').innerHTML=[
    ['diary','🥗','Дневник'],
    ['plan','✨','Рацион'],
    ['week','📊','Прогресс'],
    ['profile','👤','Профиль']
  ].map(([k,ic,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')"><span class="ni">${ic}</span><span>${l}</span></button>`).join('');

  const badgeNum = a.is_pro ? (a.remaining_daily_today??0) : ((a.trial_remaining??0) + (a.extra_ai_credits||0));
  const head=`<div class="row sp">
    <div class="logo">Snap<i>Eat</i></div>
    <div class="row">
      ${S.norm?`<button class="chip" onclick="openWeightModal()" title="Записать вес">⚖️ ${S.profile?Number(S.profile.weight).toFixed(1)+' кг':'Вес'}</button>
      <span class="chip" title="Дней подряд">🔥 ${S.streak||0}</span>`:''}
      <button class="chip ${a.is_pro?'pro':''}" onclick="openPro()">${a.is_pro?'PRO · ':'ИИ · '}${badgeNum}</button>
    </div>
  </div>`;

  $('#app').innerHTML=head+(tab==='diary'?diary():tab==='plan'?planV():tab==='week'?weekV():profileV());
  if(tab==='diary')requestAnimationFrame(()=>requestAnimationFrame(()=>{const c=$('#rc');if(c)c.style.strokeDashoffset=c.dataset.to}));
  if(tab==='week'&&!W)loadWeek();
}
function shift(n){
  const d=parseIso(day);d.setDate(d.getDate()+n);
  if(localIso(d)>localIso())return;
  day=localIso(d);load();
}
const dayLabel=()=>{
  const t=localIso(),y=localIso(new Date(Date.now()-864e5));
  return day===t?'Сегодня':day===y?'Вчера':parseIso(day).toLocaleDateString('ru',{day:'numeric',month:'long'});
};

function diary(){
  const n=S.norm;if(!n)return '';
  const t=S.total||{kcal:0,p:0,f:0,c:0},left=n.kcal-t.kcal,over=left<0,C=2*Math.PI*84,pc=n.kcal>0?Math.min(Math.max(t.kcal/n.kcal,0),1):0,from=pc0;pc0=pc;
  const greetName=S.user_name?`, ${esc(S.user_name)}`:'';
  const chHandle=(S.channel?.handle)||CHANNEL_HANDLE;
  const chBanner = !channelBannerDismissed ? `<div class="welcome-chn">
    <div class="row sp"><b>📢 Новости и обновления SnapEat</b><button type="button" class="x" style="padding:0 4px;font-size:17px" onclick="dismissChannelBanner()" title="Скрыть">✕</button></div>
    <div class="hint" style="margin-top:4px">По желанию подпишитесь на канал <b>${esc(chHandle)}</b> — там делимся новыми фичами, советами и продвижением проекта.</div>
    <div class="row" style="margin-top:10px;gap:8px"><button type="button" class="chip on" onclick="openChannel()">Подписаться на канал</button><button type="button" class="chip" onclick="dismissChannelBanner()">Позже</button></div>
  </div>` : '';
  let h=`<div class="row sp" style="margin-top:8px"><span class="hint">Привет${greetName}!</span><div class="row"><button class="x" onclick="shift(-1)">‹</button><b style="min-width:110px;text-align:center">${dayLabel()}</b><button class="x" onclick="shift(1)">›</button></div><span style="width:24px"></span></div>`+chBanner+`

  <div class="qbar">
    <button class="qtile" onclick="openAdd(dm(),'photo')"><span class="ico">📸</span><span>Фото еды</span></button>
    <button class="qtile" onclick="openAdd(dm(),'text')"><span class="ico">✍️</span><span>Текстом</span></button>
    <button class="qtile" onclick="openAdd(dm(),'label')"><span class="ico">🏷️</span><span>Этикетка</span></button>
    <button class="qtile" onclick="go('plan')"><span class="ico">✨</span><span>Меню ИИ</span></button>
  </div>`

  <div class="card"><div class="ring"><svg width="206" height="206"><circle cx="103" cy="103" r="84" fill="none" stroke="var(--line)" stroke-width="14"/>
  <circle id="rc" class="v" cx="103" cy="103" r="84" fill="none" stroke="${over?'var(--bad)':'var(--ac)'}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-from)}" data-to="${C*(1-pc)}"/></svg>
  <div class="mid"><div class="big" style="color:${over?'var(--bad)':'var(--tx)'}">${Math.abs(r0(left))}</div><div class="hint">${over?'ккал перебор':'ккал осталось'}</div><div style="margin-top:6px;font-weight:700">${r0(t.kcal)} / ${n.kcal}</div><div class="hint" style="font-size:12px">съедено / цель</div></div></div>

const psum=()=>Array.isArray(pending)?pending.reduce((s,i)=>({kcal:s.kcal+(Number(i.kcal)||0),p:s.p+(Number(i.p)||0),f:s.f+(Number(i.f)||0),c:s.c+(Number(i.c)||0)}),{kcal:0,p:0,f:0,c:0}):{kcal:0,p:0,f:0,c:0};

function onPhoto(inp,labelMode=false){
  const f=inp?.files?.[0];if(!f)return;
  if(f.size>6_000_000)return toast('Файл слишком большой');
  const img=new Image();img.onload=()=>{
    const maxSide=Math.max(img.width||1,img.height||1);
    const k=Math.min(1,1024/maxSide),c=document.createElement('canvas');
    c.width=Math.max(1,r0((img.width||1)*k));c.height=Math.max(1,r0((img.height||1)*k));
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);
    runAI('photo',c.toDataURL('image/jpeg',.82).split(',')[1],labelMode);
  };img.onerror=()=>{try{URL.revokeObjectURL(img.src)}catch{}toast('Не удалось открыть фото')};img.src=URL.createObjectURL(f);
}

const sel=(id,arr,v,ch='')=>`<select id="${id}" ${ch}>${arr.map(([k,l])=>`<option value="${k}" ${String(k)===String(v)?'selected':''}>${l}</option>`).join('')}</select>`;
function goalProgress(p){
  const cur=+p.weight, tgt=+p.target_weight;
  if(!cur || !tgt || cur===tgt) return null;
  const start = +(p.start_weight || cur);
  const totalDist = Math.abs(tgt - start);
  let pct = totalDist > 0.05 ? (tgt < start ? ((start - cur) / (start - tgt)) * 100 : ((cur - start) / (tgt - start)) * 100) : 100;
  const reached = (tgt < start && cur <= tgt) || (tgt > start && cur >= tgt);
  if(reached) pct = 100;
  return {pct: Math.max(0, Math.min(100, pct)), start, cur, tgt, remKg: Math.abs(tgt - cur), reached};
}
function goalCard(p){
  const gp=goalProgress(p);
  const tgtLabel = p.target_weight ? `${Number(p.target_weight).toFixed(1)} кг` : 'Не задана — нажмите';
  let body = `<div class="hint" style="margin-top:8px">Укажите целевой вес, чтобы видеть процент прохождения пути.</div>`;
  if(gp){
    body = `<div class="row sp" style="margin-top:10px;align-items:baseline">
      <div><span class="pct-big">${gp.pct.toFixed(0)}%</span> <span class="hint">пройдено</span></div>
      <div class="hint" style="font-weight:700;color:${gp.reached?'var(--ac)':'var(--tx)'}">${gp.reached?'Цель достигнута!':`Осталось ${gp.remKg.toFixed(1)} кг`}</div>
    </div>
    <div class="bar" style="height:9px;margin:8px 0"><i style="width:${gp.pct}%;background:var(--ac)"></i></div>
    <div class="row sp hint" style="font-size:12px"><span>Старт: ${gp.start.toFixed(1)}</span><span>Сейчас: ${gp.cur.toFixed(1)}</span><span>Цель: ${gp.tgt.toFixed(1)}</span></div>`;
  }
  return `<div class="gcard"><div class="row sp"><div><div class="hint">Цель по весу</div><button type="button" class="gbtn" style="margin-top:4px" onclick="openGoalModal()">🎯 ${tgtLabel} ✎</button></div><button type="button" class="chip" onclick="openGoalModal()">Изменить</button></div>${body}</div>`;
}

    <div><label>Тренировок в неделю</label><input id="mProfWorkouts" type="number" inputmode="numeric" min="0" max="14" value="${p.workouts_per_week??2}"></div>
  </div>
  <div class="g3">
    <div><label>Рост, см</label><input id="mProfH" type="number" inputmode="decimal" value="${p.height}"></div>
    <div><label>Вес, кг</label><input id="mProfW" type="number" step="0.1" inputmode="decimal" value="${p.weight}"></div>
    <div><label>Цель, кг</label><input id="mProfTw" type="number" step="0.1" inputmode="decimal" value="${p.target_weight||''}" placeholder="—"></div>
  </div>
  <div class="g2">
    <div><label>Образ жизни / активность</label>${sel('mProfAct',[[1.2,'Неактивный'],[1.375,'Умеренно активный'],[1.55,'Активный'],[1.725,'Очень активный'],[1.9,'Физический труд']],p.act)}</div>
    <div><label>Тип тренировок</label>${sel('mProfWType',[['mixed','Смешанные'],['strength','Силовые'],['cardio','Кардио / бег']],p.workout_type||'mixed')}</div>
  </div>
  <label>Предпочтение по рациону</label>
  ${sel('mProfFoodPref',[['balanced','Сбалансированный'],['high_protein','Больше белка'],['low_sweet','Меньше сладкого'],['low_carb','Меньше углеводов']],p.food_pref||'balanced')}
  <label>Цель</label>${sel('mProfGoal',[['lose','Похудение'],['keep','Поддержание'],['gain','Набор массы']],p.goal,'onchange="toggleModalGoal()"')}
  <div id="mProfPaceWrap" style="display:${p.goal!=='keep'?'block':'none'}"><label>Темп изменения веса</label>${sel('mProfPace',[[.25,'Мягко — 0,25 кг/нед'],[.5,'Умеренно — 0,5 кг/нед'],[.75,'Быстро — 0,75 кг/нед'],[1,'Очень быстро — 1 кг/нед']],p.pace)}</div>
  <label class="row" style="margin-top:12px;color:var(--tx);font-size:14px"><input id="mProfAiTune" type="checkbox" ${p.use_ai_tuning!==false?'checked':''}>✨ Точная подстройка КБЖУ с помощью ИИ</label>
  <div class="gcard" style="margin-top:10px">
    <label class="row" style="margin:0;color:var(--tx);font-size:14px"><input id="mProfRemOn" type="checkbox" ${p.remind_on!==0?'checked':''}>🔔 Вечерние напоминания в Telegram</label>
    <div class="row sp" style="margin-top:8px"><span class="hint">Время (местное)</span>${sel('mProfRemH',[[18,'18:00'],[19,'19:00'],[20,'20:00'],[21,'21:00'],[22,'22:00']],p.remind_hour||20)}</div>
  </div>
  <label class="row" style="margin-top:12px;color:var(--tx);font-size:14px"><input id="mProfMan" type="checkbox" ${p.manual?'checked':''} onchange="toggleModalManual()">Свои цели КБЖУ вручную</label>
  <div id="mProfManWrap" style="display:${p.manual?'block':'none'}"><div class="g2"><div><label>Ккал в день</label><input id="mProfK" type="number" inputmode="numeric" value="${p.kcal??n.kcal??''}"></div><div><label>Белки, г</label><input id="mProfP" type="number" inputmode="numeric" value="${p.p??n.p??''}"></div><div><label>Жиры, г</label><input id="mProfF" type="number" inputmode="numeric" value="${p.f??n.f??''}"></div><div><label>Углеводы, г</label><input id="mProfC" type="number" inputmode="numeric" value="${p.c??n.c??''}"></div></div></div>
  <button type="button" class="btn" id="mSaveProfBtn" onclick="saveSettingsModal()">Сохранить настройки</button>
  <button type="button" class="btn alt" onclick="closeM()">Отмена</button>`);
}

function toggleModalGoal(){
  const g=$('#mProfGoal')?.value||'keep';
  const w=$('#mProfPaceWrap');
  if(w)w.style.display=g!=='keep'?'block':'none';
}
function toggleModalManual(){
  const chk=$('#mProfMan')?.checked;
  const w=$('#mProfManWrap');
  if(w)w.style.display=chk?'block':'none';
}

async function saveSettingsModal(){
  const b={
    name:($('#mProfName')?.value??PF.name??'').trim(),
    sex:$('#mProfSex')?.value||PF.sex||'m',
    age:cleanNum($('#mProfAge')?.value),
    height:cleanNum($('#mProfH')?.value),
    weight:cleanNum($('#mProfW')?.value),
    target_weight:cleanNum($('#mProfTw')?.value)||null,
    act:cleanNum($('#mProfAct')?.value)||1.375,
    workouts_per_week:r0(cleanNum($('#mProfWorkouts')?.value)??2),
    workout_type:$('#mProfWType')?.value||PF.workout_type||'mixed',
    food_pref:$('#mProfFoodPref')?.value||PF.food_pref||'balanced',
    goal:$('#mProfGoal')?.value||PF.goal||'keep',
    pace:cleanNum($('#mProfPace')?.value)||PF.pace||0.5,
    use_ai_tuning:!!$('#mProfAiTune')?.checked,
    remind_on:$('#mProfRemOn')?.checked?1:0,
    remind_hour:cleanNum($('#mProfRemH')?.value)||20,
    manual:!!$('#mProfMan')?.checked,
    kcal:cleanNum($('#mProfK')?.value)||null,
    p:cleanNum($('#mProfP')?.value)||null,
    f:cleanNum($('#mProfF')?.value)||null,
    c:cleanNum($('#mProfC')?.value)||null,
  };
  if(!b.name)return toast('Введите имя');
  if(!Number.isFinite(b.age)||b.age<10||b.age>100)return toast('Укажите возраст от 10 до 100 лет');
  if(!Number.isFinite(b.height)||b.height<100||b.height>250)return toast('Укажите рост от 100 до 250 см');
  if(!Number.isFinite(b.weight)||b.weight<30||b.weight>300)return toast('Укажите вес от 30 до 300 кг');
  if(!Number.isFinite(b.workouts_per_week)||b.workouts_per_week<0||b.workouts_per_week>14)return toast('Тренировок в неделю: от 0 до 14');
  if(b.target_weight!==null&&(!Number.isFinite(b.target_weight)||b.target_weight<30||b.target_weight>300))return toast('Целевой вес: от 30 до 300 кг');
  b.age=r0(b.age);
  if(!b.manual)b.kcal=b.p=b.f=b.c=null;
  const btn=$('#mSaveProfBtn');if(btn){btn.disabled=true;btn.textContent='Сохраняю…'}
  try{
    const r=await api('/api/profile','POST',b);
    closeM();PF=null;S=null;tab='profile';await load();
    toast(`Сохранено! Норма: ${r.norm.kcal} ккал`);
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent='Сохранить настройки'}
    toast(e.detail||'Ошибка сохранения');
  }
}
const readP=()=>({
  name:($('#pName')?.value??PF.name??'').trim(),
  sex:$('#pSex')?.value||PF.sex||'m',
  age:cleanNum($('#pAge')?.value),
  height:cleanNum($('#pH')?.value),
  weight:cleanNum($('#pW')?.value),
  target_weight:cleanNum($('#pTw')?.value)||null,
  act:cleanNum($('#pAct')?.value)||1.375,
  workouts_per_week:r0(cleanNum($('#pWorkouts')?.value)??2),
  workout_type:$('#pWType')?.value||PF.workout_type||'mixed',
  food_pref:$('#pFoodPref')?.value||PF.food_pref||'balanced',
  use_ai_tuning:$('#pAiTune')?$('#pAiTune').checked:(PF.use_ai_tuning!==false),
  goal:$('#pGoal')?.value||PF.goal||'keep',
  pace:$('#pPace')?(cleanNum($('#pPace').value)||0.5):(PF.pace||.5),
  manual:$('#pMan')?$('#pMan').checked:!!PF.manual,
  kcal:cleanNum($('#mK')?.value)||null,
  p:cleanNum($('#mP')?.value)||null,
  f:cleanNum($('#mF')?.value)||null,
  c:cleanNum($('#mC')?.value)||null,
  remind_on:$('#pRemOn')?($('#pRemOn').checked?1:0):(PF.remind_on??1),
  remind_hour:cleanNum($('#pRemH')?.value)||20
});
function togg(){PF={...PF,...readP()};render()}
async function saveProfile(stayOnProfile=false){
  const b=readP();
  if(!b.name)return toast('Введите имя');
  if(!Number.isFinite(b.age)||b.age<10||b.age>100)return toast('Укажите возраст от 10 до 100 лет');
  if(!Number.isFinite(b.height)||b.height<100||b.height>250)return toast('Укажите рост от 100 до 250 см');
  if(!Number.isFinite(b.weight)||b.weight<30||b.weight>300)return toast('Укажите вес от 30 до 300 кг');
  if(!Number.isFinite(b.workouts_per_week)||b.workouts_per_week<0||b.workouts_per_week>14)return toast('Тренировок в неделю: от 0 до 14');
  if(b.target_weight!==null&&(!Number.isFinite(b.target_weight)||b.target_weight<30||b.target_weight>300))return toast('Целевой вес: от 30 до 300 кг');
  b.age=r0(b.age);
  if(!b.manual)b.kcal=b.p=b.f=b.c=null;
  const btn=$('#saveProfBtn');const orig=btn?.textContent;
  if(btn){btn.disabled=true;btn.textContent='Рассчитываю…'}
  try{
    const r=await api('/api/profile','POST',b);
    PF=null;S=null;regStep=1;
    if(!stayOnProfile)tab='diary';
    await load();
    toast(`Норма: ${r.norm.kcal} ккал, Б ${r.norm.p} / Ж ${r.norm.f} / У ${r.norm.c}`);
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent=orig||'Сохранить'}
    toast(e.detail);
  }
}

const fmtD=t=>new Date((Number(t)||0)*1000).toLocaleDateString('ru');
const aiLine=()=>{
  const a=S.ai;
  if(a.is_pro){
    return `PRO: осталось <b>${a.remaining_daily_today}</b> сегодня (лимит ${a.daily_limit}/д, до ${a.pro_monthly_cap}/мес)${a.extra_ai_credits?` + <b>${a.extra_ai_credits}</b> пакет`:''}`;
  }
  const tLeft=a.trial_remaining??0, tCap=a.trial_monthly_limit||5, extra=a.extra_ai_credits||0;
  const total=tLeft+extra;
  return `Пробных на месяц: <b>${tLeft}</b> из ${tCap}${extra?` + <b>${extra}</b> пакет`:''} · <span style="color:var(--ac);cursor:pointer;font-weight:700" onclick="${total<=0?"openTrialExhaustedModal()":"openPro()"}">${total<=0?'Оформить доступ':'Докупить'}</span>`;
};
const starsRow=()=>{
  const a=S.ai;
  const subTxt = a.is_pro
    ? `до ${fmtD(a.pro_until)} · сегодня ${a.remaining_daily_today}/${a.daily_limit}`
    : `Пробных на месяц: ${a.trial_remaining??0}/${a.trial_monthly_limit||5}${a.extra_ai_credits?' · пакет: '+a.extra_ai_credits:''}`;
  return `<div class="card row sp"><div class="f1"><b>${a.is_pro?'👑 SnapEat Pro активен':'💳 Тарифы и баланс ИИ'}</b><div class="hint">${subTxt}</div></div><button class="chip pro" onclick="openPro()">Тарифы</button></div>`;
};
const itemCard=(x,feat=false)=>{
  const rub = x.price_rub ?? x.price;
  const st = x.price_stars ?? x.price;
  const perReq = x.kind==='pack' && x.credits ? `<div class="hint" style="color:var(--ac);margin-top:2px">~${(rub/x.credits).toFixed(1)} ₽ или ${(st/x.credits).toFixed(1)} ⭐ за запрос</div>` : '';
  return `<div class="plan ${feat?'feat':''}">
    <div class="f1">
      <b>${esc(x.title)}</b>${x.badge?` <span class="badge">${esc(x.badge)}</span>`:''}
      <div class="hint" style="margin-top:3px">${esc(x.desc)}</div>
      ${perReq}
      <div class="row" style="gap:6px;margin-top:10px;flex-wrap:wrap">
        <button class="btn sbp" id="b_sbp_${x.id}" style="width:auto;margin:0;padding:9px 12px;font-size:13px" onclick="buyYooKassa('${x.id}','sbp')">СБП ${rub} ₽</button>
        <button class="btn alt" id="b_card_${x.id}" style="width:auto;margin:0;padding:9px 12px;font-size:13px" onclick="buyYooKassa('${x.id}','bank_card')">Карта ${rub} ₽</button>
        <button class="btn ${feat?'gold':'alt'}" id="b_stars_${x.id}" style="width:auto;margin:0;padding:9px 12px;font-size:13px" onclick="buyItem('${x.id}')">${st} ⭐</button>
      </div>
    </div>
  </div>`;
};

function openPro(msg=''){
  const a=S.ai,cat=S.catalog||[];
  const leftVal = a.is_pro ? a.remaining_daily_today : (a.trial_remaining??0);
  const capVal = a.is_pro ? a.daily_limit : (a.trial_monthly_limit||5);
  const capLabel = a.is_pro ? `сегодня из ${capVal}` : `в месяц из ${capVal}`;
  modal(`<h2>💳 Тарифы и магазин SnapEat</h2>${msg?`<div style="color:var(--cf);margin-bottom:8px;font-weight:600">${esc(msg)}</div>`:''}
  <div class="card" style="margin:0"><div class="g3" style="text-align:center">
  <div><div class="big" style="font-size:26px">${leftVal}</div><div class="hint">${capLabel}</div></div>
  <div><div class="big" style="font-size:26px;color:var(--cw)">${a.extra_ai_credits||0}</div><div class="hint">пакет запросов</div></div>
  <div><div class="big" style="font-size:26px;color:${a.is_pro?'var(--cf)':'var(--hint)'}">${a.is_pro?'PRO':'—'}</div><div class="hint">${a.is_pro?'до '+fmtD(a.pro_until):'базовый'}</div></div></div></div>

  <h2 style="margin-top:16px">👑 Подписка SnapEat Pro</h2>
  ${cat.filter(x=>x.kind==='pro').map(x=>itemCard(x,true)).join('')}

  <h2 style="margin-top:16px">⚡ Пакеты ИИ-запросов (не сгорают)</h2>
  ${cat.filter(x=>x.kind==='pack').map(x=>itemCard(x,x.id==='pack_30')).join('')}

  <h2 style="margin-top:16px">✨ Разовые функции</h2>
  ${cat.filter(x=>x.kind==='mealplan').map(x=>itemCard(x,false)).join('')}

  <div class="hint" style="margin-top:12px">Сначала тратятся ${a.trial_monthly_limit||5} пробных запросов в месяц, затем купленные пакеты. Оплата доступна через СБП/карту (ЮKassa) и Telegram Stars.</div>
  <button class="btn alt" onclick="openSupport()">💬 Поддержка ${esc((S.support?.handle)||SUPPORT_HANDLE)}</button>
  <button class="btn alt" onclick="closeM()">Закрыть</button>`);
}

async function buyYooKassa(id,payment_method='sbp'){
  const x=S.catalog?.find(c=>c.id===id);
  if(!x)return toast('Тариф не найден');
  const btnId = payment_method==='sbp' ? '#b_sbp_'+id : '#b_card_'+id;
  const b=$(btnId);
  const rub = x.price_rub ?? x.price;
  const origTxt = payment_method==='sbp' ? `СБП ${rub} ₽` : `Карта ${rub} ₽`;
  const before={x:S.ai.extra_ai_credits,u:S.ai.pro_until,m:S.ai.mealplan_credits};
  const reset=()=>{if(b){b.disabled=false;b.textContent=origTxt}};
  if(b){b.disabled=true;b.textContent='…'}
  try{
    const r=await api('/api/billing/yookassa/create','POST',{item_id:id,payment_method});
    if(r.confirmation_url){
      try{tg.openLink(r.confirmation_url)}catch{window.open(r.confirmation_url,'_blank','noopener,noreferrer')}
      closeM();
      toast('Открыта страница оплаты ЮKassa. После оплаты баланс обновится автоматически.');
      await afterPay(before);
    }else{
      reset();toast('Не получена ссылка оплаты');
    }
  }catch(e){
    reset();
    toast(e.detail||'Оплата через ЮKassa временно недоступна');
  }
}

async function buyItem(id){
  const x=S.catalog?.find(c=>c.id===id),b=$('#b_stars_'+id);
  if(!x)return toast('Тариф не найден');
  const before={x:S.ai.extra_ai_credits,u:S.ai.pro_until,m:S.ai.mealplan_credits};
  const st = x.price_stars ?? x.price;
  const reset=()=>{if(b){b.disabled=false;b.textContent=st+' ⭐'}};
  if(b){b.disabled=true;b.textContent='…'}
  try{
    const r=await api('/api/billing/create-invoice','POST',{item_id:id});
    tg.openInvoice(r.invoice_url,async stRes=>{
      if(stRes==='paid'){closeM();toast('Оплата прошла, начисляю…');await afterPay(before)}
      else{reset();if(stRes==='failed')toast('Платёж не прошёл. Попробуйте ещё раз');else if(stRes==='pending')toast('Платёж обрабатывается')}
    });
  }catch(e){reset();toast(e.detail||'Не удалось создать счёт')}
}
async function afterPay(before){
  const tz=-new Date().getTimezoneOffset();
  for(let i=0;i<10;i++){
    try{const nextState=await api(`/api/state?day=${day}&today=${localIso()}&tz=${tz}`);if(nextState?.ai)S=nextState}catch{}
    if(S?.ai&&(S.ai.extra_ai_credits!==before.x||S.ai.pro_until!==before.u||S.ai.mealplan_credits!==before.m)){
      render();toast('Покупка успешно активирована!');return;
    }
    await new Promise(r=>setTimeout(r,1500));
  }
  render();toast('Платёж отправлен. Если баланс не обновился — напишите в поддержку');
}
window.addEventListener('unhandledrejection',ev=>{try{console.error(ev.reason);toast(ev?.reason?.detail||'Произошла непредвиденная ошибка')}catch{}});
window.addEventListener('error',ev=>{try{if(ev?.message&&!ev.message.includes('ResizeObserver'))toast('Ошибка интерфейса. Попробуйте обновить экран')}catch{}});
load();
</script>
</body>
</html>
