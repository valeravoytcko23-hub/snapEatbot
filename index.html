<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SnapEat — Дневник питания и КБЖУ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0f1218;
      --card: #171c26;
      --card2: #1f2633;
      --border: rgba(255,255,255,0.08);
      --text: #f3f5f8;
      --muted: #8b95a7;
      --accent: #38bdf8;
      --accent2: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --radius: 16px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      min-height: 100vh;
    }
    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 14px 14px 96px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .title {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 6px;
    }
    .sub {
      font-size: 13px;
      color: var(--muted);
      margin: 0;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(56,189,248,0.14);
      color: var(--accent);
    }
    .badge.pro {
      background: rgba(34,197,94,0.16);
      color: var(--accent2);
    }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 12px;
    }
    .kpi {
      background: var(--card2);
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
    }
    .kpi .val {
      font-size: 16px;
      font-weight: 700;
    }
    .kpi .lbl {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
    .bar {
      width: 100%;
      height: 8px;
      background: var(--card2);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
    }
    .bar > i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 999px;
      transition: width .25s ease;
    }
    .btn {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #06131f;
      transition: opacity .15s ease;
    }
    .btn:active { opacity: 0.85; }
    .btn.secondary {
      background: var(--card2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn.danger {
      background: rgba(239,68,68,0.16);
      color: #fca5a5;
    }
    .btn.sm {
      width: auto;
      padding: 7px 11px;
      font-size: 12px;
      border-radius: 10px;
    }
    input, select, textarea {
      width: 100%;
      background: var(--card2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 12px;
      font-size: 14px;
      outline: none;
      margin-top: 6px;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-top: 10px;
    }
    .meal-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .meal-item:last-child { border-bottom: 0; }
    .meal-name {
      font-size: 14px;
      font-weight: 600;
    }
    .meal-meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }
    .nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(23,28,38,0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
      z-index: 40;
    }
    .nav button {
      background: none;
      border: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 10px;
      cursor: pointer;
    }
    .nav button.active {
      color: var(--accent);
      background: rgba(56,189,248,0.12);
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 76px;
      transform: translateX(-50%);
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      z-index: 99;
      max-width: 90vw;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      display: none;
    }
    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
      text-align: center;
      color: var(--muted);
      gap: 12px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(56,189,248,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err-box {
      border-color: rgba(239,68,68,0.35);
      background: rgba(239,68,68,0.08);
    }
    .err-title {
      color: #fca5a5;
      font-weight: 700;
      font-size: 16px;
      margin: 0 0 8px;
    }
    .err-details {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      background: rgba(0,0,0,0.3);
      padding: 10px;
      border-radius: 10px;
      color: #e2e8f0;
      word-break: break-word;
      margin: 10px 0 14px;
    }
  </style>
</head>
<body>
  <div class="wrap" id="app">
    <div class="card">
      <div class="loader">
        <div class="spinner"></div>
        <div>Загрузка SnapEat...</div>
      </div>
    </div>
  </div>

  <div class="nav" id="nav" style="display:none;">
    <button data-tab="today" class="active" onclick="setTab('today')">Сегодня</button>
    <button data-tab="add" onclick="setTab('add')">+ Еда</button>
    <button data-tab="profile" onclick="setTab('profile')">Профиль</button>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      try {
        tg.ready();
        tg.expand();
      } catch (e) {
        console.warn("Telegram WebApp init warning:", e);
      }
    }

    let S = null;
    let TAB = "today";
    let LAST_ERROR = null;

    function getParams() {
      const qs = new URLSearchParams(window.location.search);
      const initData = (tg && tg.initData) ? tg.initData : (qs.get("init_data") || "");
      const devUid = qs.get("dev_uid") || "";
      return { initData, devUid };
    }

    function esc(v) {
      return String(v == null ? "" : v)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function toast(msg) {
      const el = document.getElementById("toast");
      if (!el) return;
      el.textContent = msg;
      el.style.display = "block";
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => { el.style.display = "none"; }, 3200);
    }

    async function api(path, opts = {}) {
      const { initData, devUid } = getParams();
      const url = new URL(path, window.location.origin);
      if (initData) url.searchParams.set("init_data", initData);
      if (devUid) url.searchParams.set("dev_uid", devUid);

      const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
      if (initData) headers["X-Telegram-Init-Data"] = initData;

      const res = await fetch(url.toString(), Object.assign({}, opts, { headers }));
      let data = null;
      const text = await res.text();
      try {
        data = text ? JSON.parse(text) : {};
      } catch (_) {
        data = { detail: text || ("HTTP " + res.status) };
      }
      if (!res.ok) {
        const msg = (data && (data.detail || data.error || data.message)) || ("Ошибка сервера: HTTP " + res.status);
        const err = new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
        err.status = res.status;
        throw err;
      }
      return data;
    }

    function renderFallback(err) {
      const app = document.getElementById("app");
      const nav = document.getElementById("nav");
      if (nav) nav.style.display = "none";

      const { initData, devUid } = getParams();
      const isOutsideTg = !initData && !devUid;
      const rawMsg = err && err.message ? err.message : "Не удалось загрузить данные приложения.";

      if (isOutsideTg || (err && err.status === 401)) {
        app.innerHTML = `
          <div class="card">
            <h2 class="title">Откройте SnapEat внутри Telegram</h2>
            <p class="sub" style="line-height:1.5;margin-top:8px;">
              Это мини-приложение работает через аккаунт Telegram и требует авторизации WebApp.
            </p>
            <div class="err-details">
              1. Перейдите в Telegram-бот <b>@SnapEatBot</b><br/>
              2. Нажмите кнопку меню или кнопку запуска Mini App под сообщением<br/>
              3. Не открывайте ссылку напрямую в обычном браузере
            </div>
            <button class="btn" onclick="load()">Повторить проверку</button>
          </div>
        `;
        return;
      }

      app.innerHTML = `
        <div class="card err-box">
          <div class="err-title">Не удалось загрузить SnapEat</div>
          <p class="sub" style="line-height:1.5;">
            Возникла ошибка при обращении к серверу или обработке данных. Попробуйте обновить экран.
          </p>
          <div class="err-details">${esc(rawMsg)}</div>
          <div class="row">
            <button class="btn" onclick="load()">Обновить</button>
            <button class="btn secondary" onclick="window.location.reload()">Перезагрузить</button>
          </div>
        </div>
      `;
    }

    function setTab(tab) {
      TAB = tab;
      document.querySelectorAll("#nav button").forEach(b => {
        b.classList.toggle("active", b.dataset.tab === tab);
      });
      render();
    }

    function num(v, d = 0) {
      const n = Number(v);
      return Number.isFinite(n) ? n : d;
    }

    function render() {
      const app = document.getElementById("app");
      const nav = document.getElementById("nav");
      if (!app) return;

      if (!S || typeof S !== "object") {
        renderFallback(LAST_ERROR || new Error("Пустой ответ состояния от сервера"));
        return;
      }

      if (nav) nav.style.display = "flex";

      const norm = S.norm || { kcal: 2000, p: 120, f: 65, c: 220 };
      const tot = S.totals || { kcal: 0, p: 0, f: 0, c: 0 };
      const ai = S.ai || { used: 0, limit: 3, is_pro: false };
      const meals = Array.isArray(S.meals) ? S.meals : [];
      const user = S.user || {};

      const pct = norm.kcal > 0 ? Math.min(100, Math.round((num(tot.kcal) / num(norm.kcal)) * 100)) : 0;

      if (TAB === "today") {
        app.innerHTML = `
          <div class="card">
            <div class="row">
              <div>
                <h2 class="title">Дневник на сегодня</h2>
                <p class="sub">Цель: ${Math.round(num(norm.kcal))} ккал</p>
              </div>
              <span class="badge ${ai.is_pro ? "pro" : ""}">
                ${ai.is_pro ? "PRO" : ("AI: " + num(ai.used) + "/" + num(ai.limit))}
              </span>
            </div>

            <div class="bar"><i style="width:${pct}%"></i></div>

            <div class="kpi-grid">
              <div class="kpi">
                <div class="val">${Math.round(num(tot.kcal))}</div>
                <div class="lbl">Ккал</div>
              </div>
              <div class="kpi">
                <div class="val">${Math.round(num(tot.p))}г</div>
                <div class="lbl">Белки</div>
              </div>
              <div class="kpi">
                <div class="val">${Math.round(num(tot.f))}г</div>
                <div class="lbl">Жиры</div>
              </div>
              <div class="kpi">
                <div class="val">${Math.round(num(tot.c))}г</div>
                <div class="lbl">Углеводы</div>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="row" style="margin-bottom:8px;">
              <h3 class="title" style="font-size:16px;margin:0;">Приёмы пищи (${meals.length})</h3>
              <button class="btn sm" onclick="setTab('add')">+ Добавить</button>
            </div>
            ${meals.length === 0 ? `
              <p class="sub" style="padding:12px 0;">Пока нет записей за сегодня. Отправьте фото еды боту или добавьте вручную.</p>
            ` : meals.map(m => `
              <div class="meal-item">
                <div>
                  <div class="meal-name">${esc(m.name || "Блюдо")}</div>
                  <div class="meal-meta">
                    ${Math.round(num(m.kcal))} ккал · Б ${Math.round(num(m.p))}г · Ж ${Math.round(num(m.f))}г · У ${Math.round(num(m.c))}г
                  </div>
                </div>
                ${m.id ? `<button class="btn sm danger" onclick="delMeal(${Number(m.id)})">Удалить</button>` : ""}
              </div>
            `).join("")}
          </div>
        `;
        return;
      }

      if (TAB === "add") {
        app.innerHTML = `
          <div class="card">
            <h2 class="title">Добавить приём пищи</h2>
            <p class="sub">Введите название блюда и КБЖУ или опишите еду для AI-расчёта.</p>

            <label>Описание для AI (например: овсянка 250г и банан)</label>
            <textarea id="aiText" rows="2" placeholder="Что вы съели?"></textarea>
            <button class="btn" style="margin-top:10px;" onclick="analyzeText()">Рассчитать через AI</button>
          </div>

          <div class="card">
            <h3 class="title" style="font-size:16px;">Ручной ввод</h3>
            <label>Название</label>
            <input id="mName" type="text" placeholder="Куриная грудка с рисом" />
            <div class="row">
              <div style="flex:1;">
                <label>Калории</label>
                <input id="mKcal" type="number" inputmode="numeric" placeholder="450" />
              </div>
              <div style="flex:1;">
                <label>Белки (г)</label>
                <input id="mP" type="number" inputmode="decimal" placeholder="35" />
              </div>
            </div>
            <div class="row">
              <div style="flex:1;">
                <label>Жиры (г)</label>
                <input id="mF" type="number" inputmode="decimal" placeholder="12" />
              </div>
              <div style="flex:1;">
                <label>Углеводы (г)</label>
                <input id="mC" type="number" inputmode="decimal" placeholder="48" />
              </div>
            </div>
            <button class="btn" style="margin-top:14px;" onclick="addManual()">Сохранить запись</button>
          </div>
        `;
        return;
      }

      if (TAB === "profile") {
        app.innerHTML = `
          <div class="card">
            <h2 class="title">Профиль и цели</h2>
            <p class="sub">Настройте дневную норму калорий и макронутриентов.</p>

            <label>Пол</label>
            <select id="pSex">
              <option value="m" ${user.sex === "m" ? "selected" : ""}>Мужской</option>
              <option value="f" ${user.sex === "f" ? "selected" : ""}>Женский</option>
            </select>

            <div class="row">
              <div style="flex:1;">
                <label>Возраст</label>
                <input id="pAge" type="number" value="${num(user.age, 28)}" />
              </div>
              <div style="flex:1;">
                <label>Рост (см)</label>
                <input id="pHeight" type="number" value="${num(user.height, 175)}" />
              </div>
            </div>

            <div class="row">
              <div style="flex:1;">
                <label>Вес (кг)</label>
                <input id="pWeight" type="number" step="0.1" value="${num(user.weight, 72)}" />
              </div>
              <div style="flex:1;">
                <label>Цель</label>
                <select id="pGoal">
                  <option value="lose" ${user.goal === "lose" ? "selected" : ""}>Похудение</option>
                  <option value="keep" ${!user.goal || user.goal === "keep" ? "selected" : ""}>Поддержание</option>
                  <option value="gain" ${user.goal === "gain" ? "selected" : ""}>Набор массы</option>
                </select>
              </div>
            </div>

            <button class="btn" style="margin-top:14px;" onclick="saveProfile()">Сохранить параметры</button>
          </div>
        `;
      }
    }

    async function load() {
      const app = document.getElementById("app");
      if (app && !S) {
        app.innerHTML = `
          <div class="card">
            <div class="loader">
              <div class="spinner"></div>
              <div>Загрузка данных...</div>
            </div>
          </div>
        `;
      }
      try {
        LAST_ERROR = null;
        const data = await api("/api/state");
        S = data;
        render();
      } catch (e) {
        console.error("Load failed:", e);
        LAST_ERROR = e;
        if (!S) {
          renderFallback(e);
        } else {
          toast(e.message || "Ошибка обновления данных");
        }
      }
    }

    async function addManual() {
      const name = (document.getElementById("mName").value || "").trim() || "Приём пищи";
      const kcal = num(document.getElementById("mKcal").value, 0);
      const p = num(document.getElementById("mP").value, 0);
      const f = num(document.getElementById("mF").value, 0);
      const c = num(document.getElementById("mC").value, 0);
      if (kcal <= 0) {
        toast("Укажите калорийность больше 0");
        return;
      }
      try {
        await api("/api/meal", {
          method: "POST",
          body: JSON.stringify({ name, kcal, p, f, c })
        });
        toast("Запись добавлена");
        TAB = "today";
        await load();
      } catch (e) {
        toast(e.message);
      }
    }

    async function analyzeText() {
      const text = (document.getElementById("aiText").value || "").trim();
      if (!text) {
        toast("Введите описание блюда");
        return;
      }
      try {
        toast("AI анализирует...");
        await api("/api/analyze_text", {
          method: "POST",
          body: JSON.stringify({ text })
        });
        toast("Добавлено в дневник");
        TAB = "today";
        await load();
      } catch (e) {
        toast(e.message);
      }
    }

    async function delMeal(id) {
      try {
        await api("/api/meal/" + id, { method: "DELETE" });
        toast("Удалено");
        await load();
      } catch (e) {
        toast(e.message);
      }
    }

    async function saveProfile() {
      try {
        await api("/api/profile", {
          method: "POST",
          body: JSON.stringify({
            sex: document.getElementById("pSex").value,
            age: num(document.getElementById("pAge").value, 28),
            height: num(document.getElementById("pHeight").value, 175),
            weight: num(document.getElementById("pWeight").value, 72),
            goal: document.getElementById("pGoal").value
          })
        });
        toast("Профиль обновлён");
        TAB = "today";
        await load();
      } catch (e) {
        toast(e.message);
      }
    }

    window.addEventListener("error", (ev) => {
      if (!S) {
        renderFallback(ev.error || new Error(ev.message || "Ошибка скрипта"));
      }
    });

    window.addEventListener("unhandledrejection", (ev) => {
      if (!S) {
        renderFallback(ev.reason instanceof Error ? ev.reason : new Error(String(ev.reason || "Ошибка запроса")));
      }
    });

    load();
  </script>
</body>
</html>
