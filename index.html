<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>КБЖУ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--card:var(--tg-theme-secondary-bg-color,#f2f3f5);--tx:var(--tg-theme-text-color,#111);--hint:var(--tg-theme-hint-color,#80868f);--btn:var(--tg-theme-button-color,#1f9d63);--btx:var(--tg-theme-button-text-color,#fff);--ok:#1f9d63;--bad:#e5484d;--cp:#4f8cff;--cf:#f5a524;--cc:#9b6bff;--line:rgba(128,134,143,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding:12px 14px calc(96px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
.row{display:flex;align-items:center;gap:8px}.sp{justify-content:space-between}
.card{background:var(--card);border-radius:18px;padding:14px;margin-top:12px}
h2{font-size:17px;margin:0 0 8px}.hint{color:var(--hint);font-size:13px}
.chip{border:0;background:var(--card);border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.pro{background:linear-gradient(90deg,#f5a524,#ff7a45);color:#fff;font-weight:600}
.ring{position:relative;width:200px;height:200px;margin:4px auto 0}
.ring svg{transform:rotate(-90deg)}.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{font-size:44px;font-weight:700;letter-spacing:-1.5px;line-height:1}
.mac{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin:5px 0 4px}.bar i{display:block;height:100%;border-radius:4px}
.mac b{font-size:15px}
.ent{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.ent:first-of-type{border-top:0}
.ent .n{flex:1;min-width:0}.ent .n div:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{border:0;background:none;color:var(--hint);font-size:20px;padding:4px 8px;cursor:pointer}
.add{border:0;background:var(--btn);color:var(--btx);width:34px;height:34px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer;flex:none}
.fab{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));border:0;border-radius:16px;background:var(--btn);color:var(--btx);padding:15px;font-weight:600;font-size:16px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.btn{width:100%;border:0;border-radius:14px;background:var(--btn);color:var(--btx);padding:13px;font-weight:600;cursor:pointer;margin-top:12px}.btn:disabled{opacity:.5}
.btn.alt{background:var(--card)}
#M{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:5}#M.on{display:flex}
.sheet{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;gap:3px}.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px 4px;cursor:pointer}.seg button.on{background:var(--bg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}
label{display:block;font-size:13px;color:var(--hint);margin:12px 0 4px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--btn)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g4{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.plan{border:2px solid var(--line);border-radius:16px;padding:12px;margin-top:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.plan.on{border-color:var(--btn)}
ul.f{padding-left:20px;margin:8px 0}ul.f li{margin:4px 0}
#T{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;display:none;max-width:90%}
</style>
</head>
<body>
<div id="app"></div><div id="M"></div><div id="T"></div>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
let day=iso(new Date()),S=null,pending=null,tab='text',plan='month',busy=false;
async function api(p,m='GET',b){
  const r=await fetch(p,{method:m,headers:{'Content-Type':'application/json','X-Init-Data':tg.initData},body:b?JSON.stringify(b):undefined});
  if(!r.ok){let d='';try{d=(await r.json()).detail}catch{}throw{status:r.status,detail:typeof d==='string'?d:'Проверьте введённые данные'}}
  return r.json();
}
function toast(t){const e=$('#T');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3000)}
function modal(h){$('#M').innerHTML='<div class="sheet"><div class="grab"></div>'+h+'</div>';$('#M').classList.add('on')}
function closeM(){$('#M').classList.remove('on');pending=null}
$('#M').onclick=e=>{if(e.target.id==='M'&&S&&S.norm)closeM()};
const r0=n=>Math.round(n);
const dayLabel=()=>{const t=iso(new Date());if(day===t)return'Сегодня';const y=iso(new Date(Date.now()-864e5));return day===y?'Вчера':new Date(day).toLocaleDateString('ru',{day:'numeric',month:'long'})};
function shift(n){const d=new Date(day);d.setDate(d.getDate()+n);if(iso(d)>iso(new Date()))return;day=iso(d);load()}

async function load(){
  try{S=await api('/api/state?day='+day)}catch(e){$('#app').innerHTML='<p class="hint" style="padding:30px;text-align:center">'+esc(e.detail||'Не удалось загрузить данные')+'</p>';return}
  render();if(!S.norm)openProfile();
}
function render(){
  const a=S.ai,n=S.norm,t=S.total;
  let h=`<div class="row sp"><div class="row"><button class="x" onclick="shift(-1)">‹</button><b>${dayLabel()}</b><button class="x" onclick="shift(1)">›</button></div>
  <div class="row"><button class="chip ${a.pro?'pro':''}" onclick="openPro()">${a.pro?'PRO · ':'ИИ '}${a.used}/${a.limit}</button><button class="chip" onclick="openProfile()">Профиль</button></div></div>`;
  if(!n){$('#app').innerHTML=h;return}
  const left=n.kcal-t.kcal,over=left<0,pc=Math.min(t.kcal/n.kcal,1),C=2*Math.PI*84;
  h+=`<div class="card"><div class="ring"><svg width="200" height="200"><circle cx="100" cy="100" r="84" fill="none" stroke="var(--line)" stroke-width="14"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="${over?'var(--bad)':'var(--ok)'}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pc)}"/></svg>
  <div class="mid"><div class="big" style="color:${over?'var(--bad)':'inherit'}">${Math.abs(r0(left))}</div><div class="hint">${over?'ккал перебор':'ккал осталось'}</div></div></div>
  <div class="hint" style="text-align:center;margin-top:6px">Съедено ${r0(t.kcal)} из ${n.kcal} ккал</div>
  <div class="mac">${[['p','Белки','--cp'],['f','Жиры','--cf'],['c','Углеводы','--cc']].map(([k,l,c])=>`<div><div class="hint">${l}</div><div class="bar"><i style="width:${Math.min(t[k]/n[k]*100,100)}%;background:var(${c})"></i></div><b>${r0(Math.max(n[k]-t[k],0))} г</b> <span class="hint">${t[k]>n[k]?'перебор '+r0(t[k]-n[k]):'осталось'}</span></div>`).join('')}</div></div>`;
  h+=`<div class="card"><h2>Что доесть</h2>`;
  if(S.suggest.length)h+=`<div class="hint" style="margin-bottom:4px">Подобрано под остаток: Б ${r0(Math.max(n.p-t.p,0))} · Ж ${r0(Math.max(n.f-t.f,0))} · У ${r0(Math.max(n.c-t.c,0))} г</div>`+S.suggest.map((s,i)=>`<div class="ent"><div class="n"><div>${esc(s.name)}, ${s.grams} г</div><div class="hint">${r0(s.kcal)} ккал · Б ${r0(s.p)} Ж ${r0(s.f)} У ${r0(s.c)}</div></div><button class="add" onclick="addSuggest(${i})">+</button></div>`).join('');
  else h+=`<div class="hint">${over?'Норма калорий на день уже выполнена.':left<70?'Осталось меньше 70 ккал — на сегодня достаточно.':'Нет подходящих вариантов под остаток.'}</div>`;
  h+=`</div><div class="card"><h2>Съедено</h2>`;
  h+=S.entries.length?S.entries.map(e=>`<div class="ent"><div class="n"><div>${esc(e.name)}${e.grams?', '+r0(e.grams)+' г':''}</div><div class="hint">${r0(e.kcal)} ккал · Б ${r0(e.p)} Ж ${r0(e.f)} У ${r0(e.c)}</div></div><button class="x" onclick="del(${e.id})">✕</button></div>`).join(''):'<div class="hint">Пока пусто. Добавьте первый приём пищи.</div>';
  h+=`</div><button class="fab" onclick="openAdd()">+ Добавить еду</button>`;
  $('#app').innerHTML=h;
}
async function del(id){try{await api('/api/entry/'+id,'DELETE');load()}catch(e){toast(e.detail)}}
async function addSuggest(i){await addItems([S.suggest[i]],'suggest')}
async function addItems(items,src){
  try{await api('/api/entry','POST',{day,items:items.map(({name,grams,kcal,p,f,c})=>({name,grams,kcal,p,f,c})),src});closeM();toast('Добавлено');load()}
  catch(e){toast(e.detail||'Ошибка')}
}

/* ---- Профиль ---- */
function openProfile(){
  const p=S.profile||{sex:'m',age:30,height:175,weight:75,act:1.375,goal:'keep'};
  const opt=(arr,v)=>arr.map(([k,l])=>`<option value="${k}" ${k==v?'selected':''}>${l}</option>`).join('');
  modal(`<h2>${S.norm?'Профиль':'Расскажите о себе'}</h2><div class="hint">По этим данным рассчитаю норму калорий и БЖУ.</div>
  <label>Пол</label><select id="pSex">${opt([['m','Мужской'],['f','Женский']],p.sex)}</select>
  <div class="g4"><div><label>Возраст</label><input id="pAge" type="number" inputmode="numeric" value="${p.age}"></div><div><label>Рост, см</label><input id="pH" type="number" inputmode="decimal" value="${p.height}"></div><div><label>Вес, кг</label><input id="pW" type="number" inputmode="decimal" value="${p.weight}"></div></div>
  <label>Активность</label><select id="pAct">${opt([[1.2,'Сидячий образ жизни'],[1.375,'Лёгкая: 1–3 тренировки в неделю'],[1.55,'Средняя: 3–5 тренировок'],[1.725,'Высокая: 6–7 тренировок'],[1.9,'Очень высокая: физический труд']],p.act)}</select>
  <label>Цель</label><select id="pGoal">${opt([['lose','Похудеть'],['keep','Удерживать вес'],['gain','Набрать массу']],p.goal)}</select>
  <button class="btn" onclick="saveProfile()">Рассчитать норму</button>${S.norm?'<button class="btn alt" onclick="closeM()">Закрыть</button>':''}`);
}
async function saveProfile(){
  const b={sex:$('#pSex').value,age:+$('#pAge').value,height:+$('#pH').value,weight:+$('#pW').value,act:+$('#pAct').value,goal:$('#pGoal').value};
  if(!b.age||!b.height||!b.weight)return toast('Заполните возраст, рост и вес');
  try{const r=await api('/api/profile','POST',b);closeM();await load();toast(`Норма: ${r.norm.kcal} ккал, Б ${r.norm.p} / Ж ${r.norm.f} / У ${r.norm.c}`)}
  catch(e){toast(e.detail)}
}

/* ---- Добавление еды ---- */
function openAdd(){tab='text';pending=null;renderAdd()}
function renderAdd(){
  const a=S.ai,tabs=[['text','Текст'],['photo','Фото'],['manual','Вручную']];
  let h=`<div class="seg">${tabs.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';pending=null;renderAdd()">${l}</button>`).join('')}</div>`;
  if(pending){
    h+=`<h2 style="margin-top:14px">Распознано</h2>`+(pending.length?pending.map((s,i)=>`<div class="ent"><div class="n"><div>${esc(s.name)}, ${r0(s.grams)} г</div><div class="hint">${r0(s.kcal)} ккал · Б ${r0(s.p)} Ж ${r0(s.f)} У ${r0(s.c)}</div></div><button class="x" onclick="pending.splice(${i},1);renderAdd()">✕</button></div>`).join('')+`<button class="btn" onclick="addItems(pending,'${tab}')">Добавить в дневник</button>`:'<div class="hint">Еда не найдена. Попробуйте описать точнее.</div>')+`<button class="btn alt" onclick="pending=null;renderAdd()">Назад</button>`;
  }else if(tab==='text'){
    h+=`<label>Что вы съели? Укажите продукты и вес</label><textarea id="aiText" rows="4" placeholder="Например: гречка 200 г, куриная грудка 150 г и салат с маслом"></textarea>
    <div class="hint" style="margin-top:6px">Бесплатных ИИ-запросов сегодня: ${Math.max(a.limit-a.used,0)} из ${a.limit}</div><button class="btn" id="aiBtn" onclick="runAI('text')">Рассчитать КБЖУ</button>`;
  }else if(tab==='photo'){
    h+=`<label>Сфотографируйте блюдо сверху, чтобы была видна вся порция</label><input id="aiNote" placeholder="Уточнение (необязательно): например, 350 г или без сахара">
    <input id="file" type="file" accept="image/*" style="display:none" onchange="onPhoto(this)"><button class="btn" id="aiBtn" onclick="$('#file').click()">Выбрать или снять фото</button>
    <div class="hint" style="margin-top:6px">Бесплатных ИИ-запросов сегодня: ${Math.max(a.limit-a.used,0)} из ${a.limit}</div>`;
  }else{
    h+=`<label>Название</label><input id="mName" placeholder="Например: Борщ"><div class="g2"><div><label>Вес, г</label><input id="mG" type="number" inputmode="decimal"></div><div><label>Ккал</label><input id="mK" type="number" inputmode="decimal" placeholder="авто, если пусто"></div></div>
    <div class="g4"><div><label>Белки, г</label><input id="mP" type="number" inputmode="decimal"></div><div><label>Жиры, г</label><input id="mF" type="number" inputmode="decimal"></div><div><label>Углеводы, г</label><input id="mC" type="number" inputmode="decimal"></div></div>
    <button class="btn" onclick="addManual()">Добавить</button>`;
  }
  modal(h);
}
async function addManual(){
  const v=id=>Math.max(+$(id).value||0,0),p=v('#mP'),f=v('#mF'),c=v('#mC');let k=v('#mK');if(!k)k=p*4+f*9+c*4;
  const name=$('#mName').value.trim();if(!name)return toast('Введите название');if(!k)return toast('Укажите калории или БЖУ');
  await addItems([{name,grams:v('#mG'),kcal:k,p,f,c}],'manual');
}
async function runAI(kind,image=''){
  const text=kind==='text'?$('#aiText').value.trim():($('#aiNote')?$('#aiNote').value.trim():'');
  if(kind==='text'&&!text)return toast('Опишите, что вы съели');
  if(busy)return;busy=true;const b=$('#aiBtn');b.disabled=true;b.textContent='Анализирую…';
  try{const r=await api('/api/ai','POST',{text,image});S.ai=r.ai;pending=r.items;renderAdd();render()}
  catch(e){if(e.status===402){openPro('Бесплатные ИИ-запросы на сегодня закончились')}else{toast(e.detail||'Ошибка ИИ');renderAdd()}}
  finally{busy=false}
}
function onPhoto(inp){
  const f=inp.files[0];if(!f)return;const img=new Image();img.onload=()=>{
    const k=Math.min(1,1024/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);runAI('photo',c.toDataURL('image/jpeg',.8).split(',')[1]);
  };img.onerror=()=>toast('Не удалось открыть фото');img.src=URL.createObjectURL(f);
}

/* ---- PRO ---- */
function openPro(msg=''){
  const a=S.ai;
  modal(`<h2>${a.pro?'PRO активен':'KБЖУ PRO'}</h2>${msg?`<div style="color:var(--bad);margin-bottom:6px">${esc(msg)}</div>`:''}
  ${a.pro?`<div class="hint">Действует до ${new Date(a.pro_until*1000).toLocaleDateString('ru')}. Сегодня ИИ-запросов: ${a.used} из ${a.limit}. Подписку можно продлить.</div>`:`<div class="hint">Бесплатно доступно ${a.limit} ИИ-запросов в день. Ручной ввод и подсказки «что доесть» работают без ограничений.</div>`}
  <ul class="f"><li>Расширенный лимит ИИ-запросов по тексту и фото</li><li>Быстрое добавление блюд без ручного ввода</li><li>Поддержка развития приложения</li></ul>
  ${S.plans.map(p=>`<div class="plan ${plan===p.id?'on':''}" onclick="plan='${p.id}';openPro('${esc(msg)}')"><div><b>${p.title}</b><div class="hint">${p.id==='year'?'Выгоднее, чем 12 месяцев по отдельности':'Продлевается вручную'}</div></div><b>${p.price} ⭐</b></div>`).join('')}
  <button class="btn" onclick="buy()">Оплатить Telegram Stars</button><button class="btn alt" onclick="closeM()">Не сейчас</button>`);
}
async function buy(){
  try{const r=await api('/api/pro/invoice','POST',{plan});
    tg.openInvoice(r.link,async st=>{if(st==='paid'){closeM();toast('Оплачено! Активирую PRO…');setTimeout(load,1500)}else if(st==='failed')toast('Платёж не прошёл')});
  }catch(e){toast(e.detail||'Не удалось создать счёт')}
}
load();
</script>
</body>
</html>
