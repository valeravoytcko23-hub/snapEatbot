services:
  - type: web
    name: kbju-miniapp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # https://<имя-сервиса>.onrender.com (без слеша в конце)
      - key: WEBAPP_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.4
