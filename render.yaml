services:
  - type: web
    name: snapeat
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-2.5-flash
      - key: AI_FALLBACK_MODELS
        value: gemini-2.5-flash,gemini-2.5-flash-lite
      - key: FREE_FALLBACK_API_KEY
        sync: false
      - key: FREE_FALLBACK_BASE_URL
        value: https://openrouter.ai/api/v1/chat/completions
      - key: FREE_FALLBACK_MODELS
        value: openrouter/free
      - key: FREE_FALLBACK_2_API_KEY
        sync: false
      - key: FREE_FALLBACK_2_BASE_URL
        value: https://openrouter.ai/api/v1/chat/completions
      - key: FREE_FALLBACK_2_MODELS
        value: openrouter/free
      - key: FREE_FALLBACK_3_API_KEY
        sync: false
      - key: FREE_FALLBACK_3_BASE_URL
        value: https://openrouter.ai/api/v1/chat/completions
      - key: FREE_FALLBACK_3_MODELS
        value: openrouter/free
      - key: FREE_FALLBACK_4_API_KEY
        sync: false
      - key: FREE_FALLBACK_4_BASE_URL
        value: https://openrouter.ai/api/v1/chat/completions
      - key: FREE_FALLBACK_4_MODELS
        value: openrouter/free
      - key: FREE_FALLBACK_5_API_KEY
        sync: false
      - key: FREE_FALLBACK_5_BASE_URL
        value: https://openrouter.ai/api/v1/chat/completions
      - key: FREE_FALLBACK_5_MODELS
        value: openrouter/free
      - key: FREE_FALLBACK_6_API_KEY
        sync: false
      - key: FREE_FALLBACK_6_BASE_URL
        value: https://openrouter.ai/api/v1/chat/completions
      - key: FREE_FALLBACK_6_MODELS
        value: openrouter/free
      - key: FREE_FALLBACK_7_API_KEY
        sync: false
      - key: FREE_FALLBACK_7_BASE_URL
        value: https://openrouter.ai/api/v1/chat/completions
      - key: FREE_FALLBACK_7_MODELS
        value: openrouter/free
      - key: FREE_FALLBACK_8_API_KEY
        sync: false
      - key: FREE_FALLBACK_8_BASE_URL
        value: https://openrouter.ai/api/v1/chat/completions
      - key: FREE_FALLBACK_8_MODELS
        value: openrouter/free
      - key: ADMIN_IDS
        sync: false
      - key: LOG_RETENTION_DAYS
        value: "10"
      - key: LOG_MAX_ROWS
        value: "5000"
      - key: KEEPALIVE_ENABLED
        value: "1"
      - key: YOOKASSA_SHOP_ID
        value: REPLACE_WITH_YOOKASSA_SHOP_ID
      - key: YOOKASSA_SECRET_KEY
        value: REPLACE_WITH_YOOKASSA_SECRET_KEY
      - key: YOOKASSA_RETURN_URL
        sync: false
