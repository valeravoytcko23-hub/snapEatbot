services:
  - type: web
    name: snapeat-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: AI_RELAY_URL
        sync: false
      - key: RELAY_SECRET
        sync: false
      - key: PROXYAPI_API_KEY
        sync: false
      - key: PROXYAPI_MODELS
        value: anthropic/claude-haiku-4-5
      - key: PROXYAPI_PRIORITY
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FREE_FALLBACK_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
