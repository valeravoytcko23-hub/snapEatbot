<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>SnapEat — Дневник питания и КБЖУ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b0f0e;
      --card: rgba(20, 26, 24, 0.88);
      --card-solid: #141a18;
      --card2: #1b2421;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(61, 220, 151, 0.28);
      --text: #eef5f2;
      --muted: #879992;
      --accent: #3ddc97;
      --accent-soft: rgba(61, 220, 151, 0.14);
      --accent-ink: #042416;
      --gold: #ffb84d;
      --gold-soft: rgba(255, 184, 77, 0.16);
      --danger: #ff6b6b;
      --danger-soft: rgba(255, 107, 107, 0.16);
      --cw: #4cc3ff;
      --cw-soft: rgba(76, 195, 255, 0.15);
      --radius-xl: 26px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at 50% -10%, rgba(61, 220, 151, 0.09), transparent 46%), var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Inter, sans-serif;
      font-size: 14px;
      line-height: 1.42;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .wrap {
      max-width: 540px;
      margin: 0 auto;
      padding: 12px 14px calc(102px + env(safe-area-inset-bottom, 0px));
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .card-emerald {
      background: linear-gradient(165deg, rgba(61, 220, 151, 0.13), rgba(20, 26, 24, 0.94) 58%);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-xl);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .row-tight {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .f1 {
      flex: 1;
      min-width: 0;
    }

    .title {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.4px;
      margin: 0;
    }

    .h3 {
      font-size: 15.5px;
      font-weight: 750;
      letter-spacing: -0.25px;
      margin: 0 0 6px;
    }

    .sub {
      font-size: 12.5px;
      color: var(--muted);
      margin: 3px 0 0;
      line-height: 1.38;
    }

    .logo {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.5px;
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }

    .logo span {
      color: var(--accent);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
      background: var(--card2);
      border: 1px solid var(--border);
      color: var(--text);
      white-space: nowrap;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.14s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.15s ease;
    }

    .pill:active { transform: scale(0.95); }
    .pill.accent { background: var(--accent-soft); border-color: rgba(61, 220, 151, 0.34); color: var(--accent); }
    .pill.pro { background: linear-gradient(135deg, #ffc15e, #ff8547); border: 0; color: #240e00; font-weight: 800; }
    .pill.gold { background: var(--gold-soft); border-color: rgba(255, 184, 77, 0.36); color: var(--gold); }
    .pill.blue { background: var(--cw-soft); border-color: rgba(76, 195, 255, 0.34); color: var(--cw); }

    .day-strip {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-top: 12px;
    }

    .day-pill {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 7px 2px;
      text-align: center;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .day-pill:active { transform: scale(0.94); }
    .day-pill .dw { font-size: 10.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
    .day-pill .dd { font-size: 13.5px; font-weight: 800; margin-top: 2px; }
    .day-pill.on {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: transparent;
      box-shadow: 0 6px 16px rgba(61, 220, 151, 0.28);
    }
    .day-pill.on .dw { color: rgba(4, 36, 22, 0.78); }
    .day-pill.today:not(.on) { border-color: rgba(61, 220, 151, 0.42); }

    .hero-ring-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 4px;
    }

    .hero-side {
      flex: 1;
      text-align: center;
      background: rgba(27, 36, 33, 0.72);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 10px 6px;
    }

    .hero-side .v { font-size: 16px; font-weight: 800; letter-spacing: -0.3px; }
    .hero-side .l { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .macro-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .macro-pill {
      background: rgba(27, 36, 33, 0.85);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 9px 10px;
    }

    .macro-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .macro-top b { color: var(--text); font-size: 12px; }

    .mini-bar {
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
    }

    .mini-bar > i {
      display: block;
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .meal-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 13px 15px;
      margin-bottom: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    .meal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .meal-icon {
      width: 38px;
      height: 38px;
      border-radius: 13px;
      background: var(--card2);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .plus-circle {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 0;
      background: var(--accent);
      color: var(--accent-ink);
      font-size: 21px;
      font-weight: 800;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 6px 16px rgba(61, 220, 151, 0.28);
      transition: transform 0.14s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .plus-circle:active { transform: scale(0.9); }

    .meal-entries {
      margin-top: 10px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
    }

    .meal-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.045);
    }

    .meal-item:last-child { border-bottom: 0; padding-bottom: 2px; }
    .meal-name { font-size: 13.5px; font-weight: 700; }
    .meal-meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

    .icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card2);
      color: var(--text);
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .icon-btn:active { transform: scale(0.92); }
    .icon-btn.danger { background: var(--danger-soft); color: var(--danger); border-color: rgba(255, 107, 107, 0.28); }
    .icon-btn.gold { background: var(--gold-soft); color: var(--gold); border-color: rgba(255, 184, 77, 0.28); }

    .water-drops {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .drop-slot {
      flex: 1;
      min-width: 28px;
      height: 30px;
      border-radius: 10px;
      background: var(--card2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      opacity: 0.45;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .drop-slot.filled {
      background: var(--cw-soft);
      border-color: rgba(76, 195, 255, 0.38);
      opacity: 1;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: var(--radius-md);
      padding: 12px 15px;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
      background: var(--accent);
      color: var(--accent-ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      transition: transform 0.14s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.15s ease;
    }

    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn.secondary { background: var(--card2); color: var(--text); border: 1px solid var(--border); font-weight: 650; }
    .btn.gold { background: linear-gradient(135deg, #ffc15e, #ff8547); color: #240e00; font-weight: 800; }
    .btn.danger { background: var(--danger-soft); color: var(--danger); border: 1px solid rgba(255, 107, 107, 0.28); }
    .btn.sm { width: auto; padding: 8px 12px; font-size: 12.5px; border-radius: var(--radius-sm); }

    input, select, textarea {
      width: 100%;
      background: var(--card2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
      margin-top: 6px;
      font-family: inherit;
      transition: border-color 0.15s ease;
    }

    input:focus, select:focus, textarea:focus { border-color: var(--accent); }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-top: 10px;
      font-weight: 600;
    }

    .seg {
      display: flex;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 3px;
      gap: 3px;
      margin-top: 10px;
    }

    .seg button {
      flex: 1;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      padding: 8px 6px;
      border-radius: 11px;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .seg button.on {
      background: var(--card-solid);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    .chips {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .chip {
      border: 1px solid var(--border);
      background: var(--card2);
      color: var(--text);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .chip:active { transform: scale(0.95); }
    .chip.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 800; }

    .tariff {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 13px;
      margin-top: 10px;
    }

    .tariff.featured {
      border-color: rgba(255, 184, 77, 0.45);
      background: linear-gradient(160deg, rgba(255, 184, 77, 0.09), var(--card2) 55%);
    }

    .goal-ring-box {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 13px;
      margin-top: 10px;
    }

    .weight-stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
      text-align: center;
    }

    .weight-stat {
      background: var(--card-solid);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px 6px;
    }

    .weight-stat .w-lbl { font-size: 11px; color: var(--muted); }
    .weight-stat .w-val { font-size: 14px; font-weight: 800; margin-top: 2px; }

    .nav {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      max-width: 516px;
      margin: 0 auto;
      background: rgba(22, 29, 27, 0.86);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 26px;
      display: flex;
      justify-content: space-around;
      padding: 6px;
      z-index: 40;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
    }

    .nav button {
      flex: 1;
      background: none;
      border: 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      padding: 7px 6px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      transition: all 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .nav button:active { transform: scale(0.94); }
    .nav button.active {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.68);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 60;
    }

    .sheet-backdrop.on { display: flex; }

    .sheet {
      width: 100%;
      max-width: 540px;
      max-height: 88vh;
      overflow-y: auto;
      background: #131917;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px 28px 0 0;
      padding: 12px 16px calc(24px + env(safe-area-inset-bottom, 0px));
      box-shadow: 0 -16px 40px rgba(0, 0, 0, 0.5);
      animation: sheetUp 0.22s cubic-bezier(0.2, 0.9, 0.2, 1);
    }

    .sheet-grabber {
      width: 38px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.2);
      margin: 0 auto 12px;
    }

    @keyframes sheetUp {
      from { transform: translateY(28px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .toast {
      position: fixed;
      left: 50%;
      top: 14px;
      transform: translateX(-50%);
      background: rgba(238, 245, 242, 0.96);
      color: #0b0f0e;
      padding: 10px 16px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
      z-index: 99;
      max-width: min(420px, 90vw);
      max-height: 110px;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
      display: none;
    }

    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 44px 16px;
      text-align: center;
      color: var(--muted);
      gap: 10px;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(61, 220, 151, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .err-box { border-color: rgba(255, 107, 107, 0.35); background: rgba(255, 107, 107, 0.08); }
    .err-title { color: var(--danger); font-weight: 800; font-size: 16px; margin: 0 0 6px; }
    .err-details {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      background: rgba(0, 0, 0, 0.35);
      padding: 10px 12px;
      border-radius: 12px;
      color: #e2ece8;
      word-break: break-word;
      margin: 10px 0 12px;
    }
  </style>
</head>
<body>
  <div class="wrap" id="app">
    <div class="card">
      <div class="loader">
        <div class="spinner"></div>
        <div>Загрузка SnapEat...</div>
      </div>
    </div>
  </div>

  <div class="nav" id="nav" style="display:none;">
    <button data-tab="today" class="active" onclick="setTab('today')"><span style="font-size:17px;">🥗</span><span>Дневник</span></button>
    <button data-tab="add" onclick="setTab('add')"><span style="font-size:17px;">📸</span><span>Еда и ИИ</span></button>
    <button data-tab="plan" onclick="setTab('plan')"><span style="font-size:17px;">✨</span><span>Рацион</span></button>
    <button data-tab="profile" onclick="setTab('profile')"><span style="font-size:17px;">👤</span><span>Профиль</span></button>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop" onclick="if(event.target===this)closeSheet()">
    <div class="sheet" id="sheetBody"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const SUPPORT_USERNAME = "@snapeat_manager";
    const SUPPORT_LINK = "https://t.me/snapeat_manager";

    function localIsoDate(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    let S = null;
    let TAB = "today";
    let SELECTED_DAY = localIsoDate(0);
    let SELECTED_MEAL = "breakfast";
    let ADD_SUBTAB = "ai";
    let AI_PREVIEW = [];
    let AI_PREVIEW_SRC = "text";
    let LABEL_MODE = false;
    let MEALPLAN_DATA = null;
    let LAST_ERROR = null;
    let SHOW_FULL_PROFILE_FORM = false;
    let WEEK_DATA = null;
    let SUGGEST_ITEMS = null;
    let SUGGEST_MODE = "";
    let SUGGEST_SEED = 0;
    let CHANNEL_BANNER_DISMISSED = false;

    function initTelegramSdk() {
      const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
      if (!tg) return null;
      try {
        tg.ready();
        tg.expand();
        if (typeof tg.setHeaderColor === "function") tg.setHeaderColor("#0b0f0e");
        if (typeof tg.setBackgroundColor === "function") tg.setBackgroundColor("#0b0f0e");
      } catch (_) {}
      return tg;
    }

    initTelegramSdk();

    function haptic(type = "light") {
      try {
        const tg = window.Telegram && window.Telegram.WebApp;
        if (tg && tg.HapticFeedback) {
          if (type === "success") tg.HapticFeedback.notificationOccurred("success");
          else if (type === "error") tg.HapticFeedback.notificationOccurred("error");
          else tg.HapticFeedback.impactOccurred(type);
        }
      } catch (_) {}
    }

    function extractInitDataFromHash() {
      const h = window.location.hash || "";
      if (!h.includes("tgWebAppData=")) return "";
      const m = h.match(/tgWebAppData=([^&]+)/);
      if (!m) return "";
      try { return decodeURIComponent(m[1]); } catch (_) { return m[1]; }
    }

    function getInitData() {
      const tg = initTelegramSdk();
      if (tg && typeof tg.initData === "string" && tg.initData.length > 0) return tg.initData;
      const qs = new URLSearchParams(window.location.search);
      return qs.get("init_data") || extractInitDataFromHash() || "";
    }

    function num(v, d = 0) {
      const n = Number(v);
      return Number.isFinite(n) ? n : d;
    }

    function esc(v) {
      return String(v == null ? "" : v)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function toast(msg) {
      const el = document.getElementById("toast");
      if (!el) return;
      el.textContent = String(msg || "");
      el.style.display = "block";
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => { el.style.display = "none"; }, 3100);
    }

    function openSheet(htmlContent) {
      const bd = document.getElementById("sheetBackdrop");
      const sb = document.getElementById("sheetBody");
      if (!bd || !sb) return;

    async function api(path, opts = {}) {
      const initData = getInitData();
      const url = new URL(path, window.location.origin);
      if (initData) url.searchParams.set("init_data", initData);

      const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
      if (initData) headers["X-Init-Data"] = initData;

      const ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
      const tid = ctrl ? setTimeout(() => ctrl.abort(), 35000) : null;
      let res;
      try {
        res = await fetch(url.toString(), Object.assign({}, opts, {
          headers,
          signal: ctrl ? ctrl.signal : undefined
        }));
      } catch (e) {
        if (tid) clearTimeout(tid);
        const err = new Error(e && e.name === "AbortError"
          ? "Превышено время ожидания ответа сервера"
          : "Ошибка сети при обращении к серверу");
        err.status = 0;
        throw err;
      } finally {
        if (tid) clearTimeout(tid);
      }

      const text = await res.text();
      let data = {};
      try { data = text ? JSON.parse(text) : {}; } catch (_) { data = { detail: text || ("HTTP " + res.status) }; }

      if (!res.ok) {
        const msg = (data && (data.detail || data.error || data.message)) || ("Ошибка сервера: HTTP " + res.status);
        const err = new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
        err.status = res.status;
        throw err;
      }
      return data;
    }

    function computeGoalProgress(p) {
      const prof = p || {};
      const curW = num(prof.weight, 0);
      const startW = num(prof.start_weight, curW);
      const targetW = prof.target_weight != null && prof.target_weight !== "" ? num(prof.target_weight, curW) : curW;
      const hasTarget = Math.abs(targetW - startW) > 0.05;
      const remainingKg = Math.abs(targetW - curW);
      let pct = 0;
      if (hasTarget) {
        const totalDist = Math.abs(targetW - startW);
        const doneDist = (targetW - startW) < 0 ? (startW - curW) : (curW - startW);
        pct = Math.max(0, Math.min(100, Math.round((doneDist / totalDist) * 100)));
      } else if (curW > 0) {
        pct = 100;
      }
      return { curW, startW, targetW, remainingKg: Number(remainingKg.toFixed(1)), pct, hasTarget };
    }

        if (vals.length >= 2) {

          const maxV = Math.max(...vals) + 0.5;
          const span = Math.max(0.5, maxV - minV);
          const pts = vals.map((v, idx) => {
            const x = (idx / (vals.length - 1)) * 260 + 10;
            const y = 36 - ((v - minV) / span) * 28;
            return `${x.toFixed(1)},${y.toFixed(1)}`;
          }).join(" ");

                <option value="1.2" ${num(p.act, 1.375) === 1.2 ? "selected" : ""}>Минимальная (1.2)</option>
                <option value="1.375" ${num(p.act, 1.375) === 1.375 ? "selected" : ""}>Лёгкая (1.375)</option>
                <option value="1.55" ${num(p.act, 1.375) === 1.55 ? "selected" : ""}>Средняя (1.55)</option>
                <option value="1.725" ${num(p.act, 1.375) === 1.725 ? "selected" : ""}>Высокая (1.725)</option>
              </select>
              <button class="btn" style="margin-top:14px;" onclick="saveProfile()">Рассчитать и сохранить</button>

          ` : ""}
        `;
        return;
      }
    }

    async function load() {

    function triggerQuickSaveFav(id) {

      const id = "pm_" + Math.random().toString(36).slice(2, 10);

    function fileToCompressedDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("Не удалось прочитать файл"));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => resolve(String(reader.result || ""));
          img.onload = () => {
            try {
              const maxSide = 1280;
              let w = img.width;
              let h = img.height;
              if (w > maxSide || h > maxSide) {
                if (w > h) { h = Math.round((h * maxSide) / w); w = maxSide; }
                else { w = Math.round((w * maxSide) / h); h = maxSide; }
              }
              const canvas = document.createElement("canvas");
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, w, h);
              resolve(canvas.toDataURL("image/jpeg", 0.82));
            } catch (_) {
              resolve(String(reader.result || ""));
            }
          };
          img.src = String(reader.result || "");
        };
        reader.readAsDataURL(file);
      });
    }

    async function runAiAnalyze() {
      const text = (document.getElementById("aiText")?.value || "").trim();
      const fileEl = document.getElementById("aiFile");
      const file = fileEl && fileEl.files && fileEl.files[0] ? fileEl.files[0] : null;
      if (!text && !file) return toast("Введите описание или выберите фото");
      const btn = document.getElementById("btnAiRun");
      if (btn) btn.disabled = true;
      try {
        toast("ИИ анализирует...");
        const image = file ? await fileToCompressedDataUrl(file) : "";
        AI_PREVIEW_SRC = image ? "photo" : "text";
        const res = await api("/api/ai", {
          method: "POST",
          body: JSON.stringify({ text, image, label_mode: LABEL_MODE })
        });
        AI_PREVIEW = Array.isArray(res.items) ? res.items : [];
        if (!AI_PREVIEW.length) toast("ИИ не распознал позиции");
        else haptic("success");
        render();
      } catch (e) {
        haptic("error");
        toast(e.message);
      } finally {
        if (btn) btn.disabled = false;
      }
    }

      try {
        await api("/api/entry", {

            meal: SELECTED_MEAL,

    window.addEventListener("error", (ev) => {

    window.addEventListener("unhandledrejection", (ev) => {
      if (!S) renderFallback(ev.reason instanceof Error ? ev.reason : new Error(String(ev.reason || "Ошибка запроса")));
