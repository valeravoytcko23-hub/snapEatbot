<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SnapEat · Admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0b0f0e;--card:rgba(20,26,24,.92);--c2:#1b2421;--c3:#222e2a;--line:rgba(255,255,255,.08);
  --tx:#eef5f2;--hint:#879992;--ac:#3ddc97;--bad:#ff6b6b;--gold:#ffb84d;--cw:#4cc3ff
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:radial-gradient(circle at 50% -10%, rgba(61,220,151,.08), transparent 45%), var(--bg);
  color:var(--tx);font:14px/1.42 -apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
  padding:12px 14px calc(94px + env(safe-area-inset-bottom,0px));
  max-width:640px;margin-left:auto;margin-right:auto;
}
button,input,select,textarea{font:inherit;color:inherit}
.row{display:flex;align-items:center;gap:8px}.sp{justify-content:space-between}.f1{flex:1;min-width:0}
.card{
  background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--line);border-radius:22px;padding:15px;margin-top:12px;
  box-shadow:0 10px 28px rgba(0,0,0,.22);
}
h2{font-size:16px;font-weight:800;letter-spacing:-.25px;margin:0 0 8px}
.hint{color:var(--hint);font-size:12px}
.logo{font-weight:900;font-size:19px;letter-spacing:-.5px;display:flex;align-items:center;gap:6px}
.logo i{color:var(--ac);font-style:normal}
.pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--c2);border:1px solid var(--line)}
.pill.pro{background:linear-gradient(135deg,#ffc15e,#ff7a45);color:#240e00;border:0}
.pill.err{background:rgba(255,107,107,.16);color:var(--bad);border-color:rgba(255,107,107,.35)}
.pill.warn{background:rgba(255,184,77,.16);color:var(--gold);border-color:rgba(255,184,77,.35)}
.pill.ok{background:rgba(61,220,151,.14);color:var(--ac);border-color:rgba(61,220,151,.3)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--c2);border:1px solid var(--line);border-radius:16px;padding:11px}
.stat .v{font-size:21px;font-weight:800;letter-spacing:-.5px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--c2);border-radius:12px;padding:9px 11px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
.btn{border:0;border-radius:13px;background:var(--ac);color:#042416;padding:9px 12px;font-weight:750;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5}
.btn.alt{background:var(--c2);color:var(--tx);border:1px solid var(--line)}
.btn.dn{background:rgba(255,107,107,.16);color:var(--bad);border:1px solid rgba(255,107,107,.35)}
.btn.gold{background:linear-gradient(135deg,#ffc15e,#ff8547);color:#240e00;font-weight:800}
.chip{border:1px solid var(--line);background:var(--c2);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:650;cursor:pointer}
.chip.on{background:var(--ac);color:#042416;font-weight:800;border-color:transparent}
.item{padding:11px 0;border-top:1px solid var(--line)}.item:first-of-type{border-top:0}
.wk{display:flex;gap:6px;align-items:flex-end;height:96px;margin-top:10px}
.wk .d{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.wk i{display:block;width:100%;background:var(--ac);border-radius:6px 6px 2px 2px;min-height:3px}
nav{
  position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));
  max-width:616px;margin:0 auto;display:flex;gap:4px;
  background:rgba(22,29,27,.9);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:6px;z-index:5;
  box-shadow:0 12px 32px rgba(0,0,0,.45);
}
nav button{
  flex:1;border:0;background:none;padding:6px 2px;border-radius:18px;color:var(--hint);
  cursor:pointer;font-weight:700;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px
}
nav button.on{color:var(--ac);background:rgba(61,220,151,.14)}
#M{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;z-index:8}#M.on{display:flex}
.sheet{background:#131917;border-top:1px solid var(--line);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:26px 26px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom,0px))}
#T{position:fixed;left:50%;top:12px;transform:translateX(-50%);background:#eef5f2;color:#0b0f0e;padding:9px 15px;border-radius:999px;font-size:13px;font-weight:750;z-index:10;display:none;max-width:92%}
</style>
</head>
<body>
<div id="app"></div><nav id="nav"></nav><div id="M"></div><div id="T"></div>
<script>
const tg=window.Telegram?.WebApp||{ready(){},expand(){},initData:''};
tg.ready();tg.expand();try{tg.setHeaderColor('#0b0f0e');tg.setBackgroundColor('#0b0f0e')}catch{}

function getInitData(){
  if(tg&&typeof tg.initData==='string'&&tg.initData.length>0)return tg.initData;
  const qs=new URLSearchParams(window.location.search);
  return qs.get('init_data')||'';
}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTs=ts=>ts?new Date(Number(ts)*1000).toLocaleString('ru',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const fmtD=ts=>ts?new Date(Number(ts)*1000).toLocaleDateString('ru'):'—';

let tab='dash',STATS=null,USERS=[],USERS_TOTAL=0,USER_Q='',USER_F='all';
let PAYS=[],PAY_Q='',REQS=[],REQ_F='open',LOGS=[],LOG_LVL='',LOG_Q='',LOG_RET=10;

function toast(t){const e=$('#T');if(!e)return;e.textContent=String(t||'');e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3000)}
function modal(h){const m=$('#M');m.innerHTML='<div class="sheet">'+h+'</div>';m.classList.add('on')}
function closeM(){$('#M').classList.remove('on')}
$('#M').onclick=e=>{if(e.target.id==='M')closeM()};

async function api(p,m='GET',b){
  const initData=getInitData();
  const url=new URL(p,window.location.origin);
  if(initData)url.searchParams.set('init_data',initData);
  const ctrl=typeof AbortController!=='undefined'?new AbortController():null;const tid=ctrl?setTimeout(()=>ctrl.abort(),30000):null;
  let r;try{r=await fetch(url.toString(),{method:m,headers:{'Content-Type':'application/json','X-Init-Data':initData},body:b?JSON.stringify(b):undefined,signal:ctrl?.signal});}catch(err){if(tid)clearTimeout(tid);throw{status:0,detail:err?.name==='AbortError'?'Таймаут запроса к серверу':'Ошибка сети'}}finally{if(tid)clearTimeout(tid);}
  if(!r.ok){let d='';try{d=(await r.json()).detail}catch{}throw{status:r.status,detail:typeof d==='string'?d:'Ошибка запроса'}}
  return r.json();
}

function renderNav(){
  const badge=STATS?.open_requests?` (${STATS.open_requests})`:'';
  $('#nav').innerHTML=[
    ['dash','📊','Сводка'],
    ['users','👥','Юзеры'],
    ['reqs','📩','Запросы'+badge],
    ['pays','💳','Оплаты'],
    ['logs','🧾','Логи']
  ].map(([k,ic,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')"><span style="font-size:17px">${ic}</span><span>${l}</span></button>`).join('');
}

async function go(k){
  tab=k;render();
  if(k==='dash')await loadStats(false);
  else if(k==='users')await loadUsers();
  else if(k==='reqs')await loadReqs();
  else if(k==='pays')await loadPays();
  else if(k==='logs')await loadLogs();
}

function render(){
  renderNav();
  const head=`<div class="row sp">
    <div class="logo">Snap<i>Eat</i> <span class="pill ok">ADMIN</span></div>
    <div class="row">
      <a class="chip" href="/" style="text-decoration:none">← Дневник</a>
      <button class="chip" onclick="refreshTab()">↻</button>
    </div>
  </div>`;
  let body='';
  if(tab==='dash')body=viewDash();
  else if(tab==='users')body=viewUsers();
  else if(tab==='reqs')body=viewReqs();
  else if(tab==='pays')body=viewPays();
  else body=viewLogs();
  $('#app').innerHTML=head+body;
}

async function refreshTab(){
  if(tab==='dash')await loadStats(true);
  else if(tab==='users')await loadUsers();
  else if(tab==='reqs')await loadReqs();
  else if(tab==='pays')await loadPays();
  else if(tab==='logs')await loadLogs();
  toast('Обновлено');
}

function viewDash(){
  if(!STATS)return `<div class="card"><div class="hint">Загрузка статистики…</div></div>`;
  const s=STATS;
  const chart=s.daily_chart||[];
  const mx=Math.max(1,...chart.map(x=>x.rub||x.stars||x.count||0));
  return `
  <div class="card">
    <h2>⚡ Быстрая выдача / отзыв по @username или ID</h2>
    <div class="row" style="margin-top:6px">
      <input id="qTarget" placeholder="@username или user_id">
      <input id="qDays" type="number" value="30" min="1" max="3650" style="width:82px" title="Дней">
    </div>
    <div class="row" style="margin-top:8px;flex-wrap:wrap">
      <button class="btn gold f1" onclick="quickAction('grant_pro')">👑 Выдать Pro</button>
      <button class="btn dn" onclick="quickAction('revoke_pro')">Забрать Pro</button>
      <button class="btn alt" onclick="quickAction('add_credits',10)">+10 ИИ</button>
      <button class="btn alt" onclick="quickAction('add_mealplan',1)">+1 Рацион</button>
    </div>
  </div>

  <div class="card">
    <h2>📈 Статистика проекта</h2>
    <div class="g2">
      <div class="stat"><div class="hint">Всего пользователей</div><div class="v">${s.total_users}</div><div class="hint">+${s.new_24h} за 24ч · +${s.new_7d} за 7д</div></div>
      <div class="stat"><div class="hint">Активных Pro</div><div class="v" style="color:var(--gold)">${s.active_pro}</div><div class="hint">Активны 24ч: ${s.active_24h}</div></div>
      <div class="stat"><div class="hint">Выручка (30 дней)</div><div class="v" style="color:var(--ac)">${Math.round(s.rub_30d)} ₽</div><div class="hint">${s.stars_30d} ⭐ · Всего ${s.total_payments} опл.</div></div>
      <div class="stat"><div class="hint">ИИ-запросов (сегодня / мес)</div><div class="v">${s.ai_today} <span class="hint" style="font-size:13px">/ ${s.ai_month}</span></div><div class="hint">Ошибок 24ч: <b style="color:${s.errors_24h?'var(--bad)':'var(--ac)'}">${s.errors_24h}</b></div></div>
    </div>
    <div class="hint" style="margin-top:12px">Оплаты за последние 7 дней (₽ / ⭐)</div>
    <div class="wk">${chart.map(d=>{
      const v=d.rub||d.stars||d.count||0;
      const h=Math.max(4,Math.round(v/mx*72));
      return `<div class="d"><span class="hint" style="font-size:9px;margin-bottom:3px">${v?Math.round(v):''}</span><i style="height:${h}px"></i><span class="hint" style="font-size:10px;margin-top:4px">${d.day.slice(5)}</span></div>`;
    }).join('')}</div>
  </div>

  <div class="card">
    <h2>📢 Рассылка пользователям</h2>
    <select id="bcAud">
      <option value="all">Все пользователи</option>
      <option value="pro">Только активные Pro</option>
      <option value="free">Только бесплатный тариф</option>
    </select>
    <textarea id="bcMsg" rows="3" placeholder="Текст объявления или обновления…" style="margin-top:8px"></textarea>
    <button class="btn" style="margin-top:8px;width:100%" onclick="sendBroadcast()">Отправить рассылку</button>
  </div>`;
}

function viewUsers(){
  return `
  <div class="card">
    <div class="row sp"><h2>👥 Пользователи (${USERS_TOTAL})</h2></div>
    <input id="uSearch" placeholder="Поиск по @username, имени или ID…" value="${esc(USER_Q)}" onkeydown="if(event.key==='Enter')searchUsers()">
    <div class="row" style="margin-top:8px">
      ${[['all','Все'],['pro','👑 Pro'],['credits','⚡ С балансом']].map(([k,l])=>`<button class="chip ${USER_F===k?'on':''}" onclick="USER_F='${k}';loadUsers()">${l}</button>`).join('')}
      <button class="btn alt" style="padding:6px 11px;font-size:12px;margin-left:auto" onclick="searchUsers()">Найти</button>
    </div>
    ${USERS.length?USERS.map(u=>`<div class="item">
      <div class="row sp">
        <div class="f1">
          <b>${esc(u.name||'Без имени')}</b> ${u.username?`<span class="hint">@${esc(u.username)}</span>`:''} <span class="hint">#${u.id}</span>
          <div class="hint">Баланс: <b>+${u.extra_ai_credits}</b> ИИ · <b>${u.mealplan_credits}</b> рац. · Реф: ${u.ref_count} · Был: ${fmtTs(u.last_seen)}</div>
        </div>
        <div class="row">
          ${u.is_pro?`<span class="pill pro">${u.pro_days_left}д</span>`:`<span class="pill">Free</span>`}
          <button class="chip" onclick="openUserModal(${u.id})">⚙️</button>
        </div>
      </div>
    </div>`).join(''):`<div class="hint" style="margin-top:12px">Пользователи не найдены</div>`}
  </div>`;
}

function viewReqs(){
  return `
  <div class="card">
    <div class="row sp"><h2>📩 Обращения пользователей</h2></div>
    <div class="row" style="margin-bottom:8px">
      ${[['open','Открытые'],['new','Новые'],['in_progress','В работе'],['done','Решённые'],['all','Все']].map(([k,l])=>`<button class="chip ${REQ_F===k?'on':''}" onclick="REQ_F='${k}';loadReqs()">${l}</button>`).join('')}
    </div>
    ${REQS.length?REQS.map(r=>`<div class="item">
      <div class="row sp">
        <div><b>#${r.id}</b> · <b>${esc(r.user_name||'User')}</b> ${r.username?`<span class="hint">@${esc(r.username)}</span>`:''} <span class="hint">#${r.uid}</span></div>
        <span class="pill ${r.status==='new'?'warn':r.status==='done'?'ok':''}">${esc(r.status)}</span>
      </div>
      <div style="margin-top:6px">${esc(r.message)}</div>
      ${r.admin_note?`<div class="hint" style="margin-top:4px">Заметка: ${esc(r.admin_note)}</div>`:''}
      <div class="row sp" style="margin-top:8px">
        <span class="hint">${fmtTs(r.created_at)}</span>
        <button class="chip" onclick="openReqModal(${r.id})">Ответить / статус</button>
      </div>
    </div>`).join(''):`<div class="hint" style="margin-top:10px">Обращений нет</div>`}
  </div>`;
}

function viewPays(){
  return `
  <div class="card">
    <h2>💳 История оплат (Stars и ЮKassa)</h2>
    <input id="pSearch" placeholder="Поиск по @username, ID, тарифу или charge_id…" value="${esc(PAY_Q)}" onkeydown="if(event.key==='Enter'){PAY_Q=this.value;loadPays()}">
    ${PAYS.length?PAYS.map(p=>`<div class="item">
      <div class="row sp">
        <div><b>${esc(p.item_title||p.item_id)}</b> <span class="pill">${esc(p.provider||'stars')}</span></div>
        <b style="color:var(--ac)">${p.amount_rub>0?Math.round(p.amount_rub)+' ₽':p.stars+' ⭐'}</b>
      </div>
      <div class="hint" style="margin-top:3px">${esc(p.user_name||'')} ${p.username?'@'+esc(p.username):''} · ID ${p.uid} · ${fmtTs(p.ts)}</div>
      <div class="hint" style="font-size:11px;word-break:break-all">${esc(p.charge_id)}</div>
    </div>`).join(''):`<div class="hint" style="margin-top:10px">Оплат пока нет</div>`}
  </div>`;
}

function viewLogs(){
  return `
  <div class="card">
    <div class="row sp">
      <h2>🧾 Логи системы (хранение ${LOG_RET} дн.)</h2>
      <button class="chip" onclick="pruneLogs()">Очистить старые</button>
    </div>
    <div class="row" style="margin-bottom:8px;flex-wrap:wrap">
      ${[['','Все'],['ERROR','❌ ERROR'],['WARNING','⚠️ WARN'],['INFO','ℹ️ INFO']].map(([k,l])=>`<button class="chip ${LOG_LVL===k?'on':''}" onclick="LOG_LVL='${k}';loadLogs()">${l}</button>`).join('')}
    </div>
    <input id="lSearch" placeholder="Фильтр по событию, тексту ошибки или user_id…" value="${esc(LOG_Q)}" onkeydown="if(event.key==='Enter'){LOG_Q=this.value;loadLogs()}">
    ${LOGS.length?LOGS.map(x=>`<div class="item">
      <div class="row sp">
        <div class="row">
          <span class="pill ${x.level==='ERROR'?'err':x.level==='WARNING'?'warn':'ok'}">${esc(x.level)}</span>
          <b>${esc(x.event)}</b>
        </div>
        <span class="hint">${fmtTs(x.ts)}${x.uid?' · #'+x.uid:''}</span>
      </div>
      ${x.details?`<div class="hint" style="color:var(--tx);margin-top:4px;word-break:break-word">${esc(x.details)}</div>`:''}
    </div>`).join(''):`<div class="hint" style="margin-top:10px">Записей лога нет</div>`}
  </div>`;
}

async function loadStats(force=false){
  try{STATS=await api('/api/admin/stats'+(force?'?force=1':''));}
  catch(e){
    if(e.status===403||e.status===401){
      $('#app').innerHTML=`<div class="card"><h2>Доступ ограничен</h2><div class="hint">${esc(e.detail||'Откройте админ-панель из аккаунта администратора Telegram.')}</div></div>`;
      return;
    }
    toast(e.detail);
  }
  render();
}

async function loadUsers(){
  try{const r=await api(`/api/admin/users?q=${encodeURIComponent(USER_Q)}&filter=${encodeURIComponent(USER_F)}&limit=40`);USERS=r.users||[];USERS_TOTAL=r.total||0;}
  catch(e){toast(e.detail)}
  render();
}

function searchUsers(){USER_Q=($('#uSearch')?.value||'').trim();loadUsers()}

async function quickAction(action,amount=0){
  const target=($('#qTarget')?.value||'').trim();
  const days=Number($('#qDays')?.value||30);
  if(!target)return toast('Введите @username или user_id');
  try{
    const r=await api('/api/admin/users/action','POST',{target,action,days,amount,notify:true});
    toast('Готово: '+(r.user?.username?`@${r.user.username}`:r.user?.id));
    await loadStats(true);
  }catch(e){toast(e.detail)}
}

function openUserModal(uid){
  const u=USERS.find(x=>x.id===uid);if(!u)return;
  modal(`
    <div class="row sp"><b>${esc(u.name||'Пользователь')} ${u.username?'@'+esc(u.username):''} (#${u.id})</b><button class="chip" onclick="closeM()">✕</button></div>
    <div class="hint" style="margin-top:4px">Статус: ${u.is_pro?`Pro до ${fmtD(u.pro_until)} (${u.pro_days_left}д)`:'Free'} · Бонус ИИ: ${u.extra_ai_credits} · Рационы: ${u.mealplan_credits}</div>
    <label class="hint" style="display:block;margin-top:10px">Дней Pro</label>
    <input id="mDays" type="number" value="30" min="1" max="3650">
    <div class="row" style="margin-top:8px">
      <button class="btn gold f1" onclick="runUserModal(${u.id},'grant_pro')">Выдать Pro</button>
      <button class="btn dn" onclick="runUserModal(${u.id},'revoke_pro')">Отозвать Pro</button>
    </div>
    <label class="hint" style="display:block;margin-top:12px">Начислить / задать ИИ-запросы</label>
    <div class="row" style="margin-top:4px">
      <input id="mCred" type="number" value="10">
      <button class="btn alt" onclick="runUserModal(${u.id},'add_credits')">+ К балансу</button>
      <button class="btn alt" onclick="runUserModal(${u.id},'set_credits')">Установить</button>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn alt f1" onclick="runUserModal(${u.id},'add_mealplan',1)">+1 Рацион</button>
      <button class="btn alt f1" onclick="runUserModal(${u.id},'reset_limits',0)">Сбросить лимиты</button>
    </div>
  `);
}

async function runUserModal(uid,action,presetAmt=null){
  const days=Number($('#mDays')?.value||30);
  const amount=presetAmt!==null?presetAmt:Number($('#mCred')?.value||0);
  try{
    await api('/api/admin/users/action','POST',{target:String(uid),action,days,amount,notify:true});
    closeM();toast('Сохранено');await loadUsers();
  }catch(e){toast(e.detail)}
}

async function sendBroadcast(){
  const audience=$('#bcAud')?.value||'all';
  const message=($('#bcMsg')?.value||'').trim();
  if(message.length<3)return toast('Введите текст рассылки');
  try{
    const r=await api('/api/admin/broadcast','POST',{audience,message});
    $('#bcMsg').value='';
    toast(`Отправлено: ${r.sent}, ошибок: ${r.failed}`);
  }catch(e){toast(e.detail)}
}

async function loadReqs(){
  try{const r=await api(`/api/admin/requests?status=${encodeURIComponent(REQ_F)}&limit=50`);REQS=r.requests||[];}
  catch(e){toast(e.detail)}
  render();
}

function openReqModal(id){
  const r=REQS.find(x=>x.id===id);if(!r)return;
  modal(`
    <div class="row sp"><b>Обращение #${r.id} · ${esc(r.user_name||'User')}</b><button class="chip" onclick="closeM()">✕</button></div>
    <div style="margin-top:8px;padding:10px;border-radius:12px;background:var(--c2)">${esc(r.message)}</div>
    <label class="hint" style="display:block;margin-top:10px">Статус</label>
    <select id="rStatus">
      ${[['new','Новый'],['in_progress','В работе'],['done','Решён'],['rejected','Отклонён']].map(([k,l])=>`<option value="${k}" ${r.status===k?'selected':''}>${l}</option>`).join('')}
    </select>
    <label class="hint" style="display:block;margin-top:8px">Внутренняя заметка</label>
    <input id="rNote" value="${esc(r.admin_note||'')}" placeholder="Комментарий для себя">
    <label class="hint" style="display:block;margin-top:8px">Ответ пользователю в Telegram (если заполнить — отправится в бот)</label>
    <textarea id="rReply" rows="3" placeholder="Напишите ответ пользователю…"></textarea>
    <button class="btn" style="margin-top:10px;width:100%" onclick="saveReq(${r.id})">Сохранить</button>
  `);
}

async function saveReq(id){
  try{
    const r=await api(`/api/admin/requests/${id}`,'POST',{
      status:$('#rStatus').value,
      admin_note:$('#rNote').value,
      reply_to_user:$('#rReply').value
    });
    closeM();toast(r.reply_sent?'Сохранено и ответ отправлен':'Статус обновлён');await loadReqs();
  }catch(e){toast(e.detail)}
}

async function loadPays(){
  try{const r=await api(`/api/admin/payments?q=${encodeURIComponent(PAY_Q)}&limit=50`);PAYS=r.payments||[];}
  catch(e){toast(e.detail)}
  render();
}

async function loadLogs(){
  try{const r=await api(`/api/admin/logs?level=${encodeURIComponent(LOG_LVL)}&q=${encodeURIComponent(LOG_Q)}&limit=80`);LOGS=r.logs||[];LOG_RET=r.retention_days||10;}
  catch(e){toast(e.detail)}
  render();
}

async function pruneLogs(){
  try{await api('/api/admin/logs/prune','POST');toast('Старые логи очищены');await loadLogs();}
  catch(e){toast(e.detail)}
}

loadStats(false);
</script>
</body>
</html>
